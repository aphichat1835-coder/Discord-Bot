<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Phomueangtai — Dashboard</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI','Noto Sans Thai',sans-serif;background:#07050f;background-image:radial-gradient(ellipse at 20% 20%,rgba(124,58,237,.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(168,85,247,.08) 0%,transparent 50%);color:#ede9fe;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:rgba(20,15,40,.9);border:1px solid rgba(120,80,255,.2);border-radius:20px;padding:52px 40px;text-align:center;max-width:460px;width:100%;box-shadow:0 16px 48px rgba(124,58,237,.15)}
  .logo{font-size:3rem;margin-bottom:16px}
  h1{font-size:1.5rem;font-weight:900;background:linear-gradient(135deg,#a855f7,#d8b4fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
  .sub{color:#7c3aed88;font-size:.85rem;margin-bottom:32px;line-height:1.6}
  .btn-discord{display:inline-flex;align-items:center;gap:10px;padding:13px 30px;background:#5865f2;color:#fff;border-radius:12px;text-decoration:none;font-weight:700;font-size:.95rem;transition:all .2s}
  .btn-discord:hover{background:#4752c4;box-shadow:0 0 20px rgba(88,101,242,.4);transform:translateY(-1px)}
  .features{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
  .feat{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.15);border-radius:10px;padding:12px;font-size:.78rem;color:#a78bfa}
  .feat .icon{font-size:1.2rem;display:block;margin-bottom:4px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🛡️</div>
  <h1>Phomueangtai Dashboard</h1>
  <p class="sub">เข้าสู่ระบบด้วย Discord เพื่อจัดการการตั้งค่าบอทในเซิร์ฟเวอร์ของคุณ</p>
  <a href="/oauth/admin" class="btn-discord">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.08.112 18.1.128 18.11a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
    เข้าสู่ระบบด้วย Discord
  </a>
  <div class="features">
    <div class="feat"><span class="icon">✅</span>ระบบยืนยันตัวตน</div>
    <div class="feat"><span class="icon">📊</span>ดูสถิติสมาชิก</div>
    <div class="feat"><span class="icon">🔒</span>ตั้งค่าความปลอดภัย</div>
    <div class="feat"><span class="icon">🎭</span>จัดการยศอัตโนมัติ</div>
  </div>
</div>
</body>
</html>
