<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ตั้งค่าเซิร์ฟเวอร์ — Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0e0e1a;
      color: #e0e0ff;
      min-height: 100vh;
    }
    header {
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; color: #c9b6ff; }
    .back {
      color: #9090bb;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back:hover { color: #c9b6ff; }
    .container { max-width: 860px; margin: 40px auto; padding: 0 24px; }
    .section {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
    }
    .section h2 { font-size: 1.1rem; color: #c9b6ff; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: #9090bb; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #e0e0ff;
      font-size: 0.95rem;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus, select:focus { border-color: #5865f2; }
    .btn {
      padding: 10px 28px;
      background: #5865f2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #4752c4; }
    .guild-info { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .guild-icon {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: #5865f2;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    .guild-name { font-size: 1.2rem; font-weight: 600; }
    .guild-id { font-size: 0.8rem; color: #9090bb; }
  </style>
</head>
<body>
  <header>
    <h1>⚙️ ตั้งค่าเซิร์ฟเวอร์</h1>
    <a href="/guilds" class="back">← กลับ</a>
  </header>

  <div class="container">
    <div class="section">
      <div class="guild-info">
        <div class="guild-icon">🏰</div>
        <div>
          <div class="guild-name" id="guild-name">ชื่อเซิร์ฟเวอร์</div>
          <div class="guild-id" id="guild-id">ID: 000000000000000000</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>🔔 ตั้งค่าห้อง Log</h2>
      <label>ห้องสำหรับ Audit Log</label>
      <select id="log-channel">
        <option value="">— เลือกห้อง —</option>
      </select>
      <button class="btn" onclick="saveLogChannel()">บันทึก</button>
    </div>

    <div class="section">
      <h2>✅ ตั้งค่าระบบยืนยันตัวตน</h2>
      <label>ยศที่ได้รับเมื่อยืนยันสำเร็จ</label>
      <select id="verify-role">
        <option value="">— เลือกยศ —</option>
      </select>
      <label>ประเภทการยืนยัน</label>
      <select id="verify-type">
        <option value="button">กดปุ่ม (ง่าย)</option>
        <option value="oauth">OAuth2 Discord</option>
      </select>
      <button class="btn" onclick="saveVerify()">บันทึก</button>
    </div>
  </div>

  <script>
    // TODO: โหลดข้อมูลจาก /api/guild/:id แล้วแสดงผล
    const params = new URLSearchParams(window.location.search);
    const guildId = window.location.pathname.split('/').pop();
    document.getElementById('guild-id').textContent = 'ID: ' + guildId;

    async function loadGuild() {
      // TODO: fetch(`/api/guild/${guildId}`)
    }

    function saveLogChannel() {
      const ch = document.getElementById('log-channel').value;
      // TODO: POST /api/guild/:id/settings { logChannel: ch }
      alert('บันทึกแล้ว: ' + ch);
    }

    function saveVerify() {
      const role = document.getElementById('verify-role').value;
      const type = document.getElementById('verify-type').value;
      // TODO: POST /api/guild/:id/settings { verifyRole: role, verifyType: type }
      alert('บันทึกแล้ว');
    }

    loadGuild();
  </script>
</body>
</html>
