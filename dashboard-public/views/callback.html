<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ยืนยันตัวตน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:           #070910;
  --card:         rgba(255,255,255,0.035);
  --card-border:  rgba(255,255,255,0.07);
  --text:         #eef0f8;
  --muted:        rgba(255,255,255,0.38);
  --green:        #00e676;
  --green-dim:    #00b248;
  --green-glow:   rgba(0,230,118,.28);
  --red:          #ff4f4f;
  --red-dim:      #c62828;
  --red-glow:     rgba(255,79,79,.28);
  --discord:      #5865f2;
  --discord-dim:  #4752c4;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

html,body {
  height: 100%;
  font-family: 'IBM Plex Sans Thai', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}

/* ── Ambient blobs ── */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0;
  transition: opacity 1.2s ease, background-color 1.2s ease;
  pointer-events: none;
  z-index: 0;
}
.blob-tl { width:360px; height:360px; top:-80px;  left:-80px;  }
.blob-br { width:440px; height:440px; bottom:-100px; right:-100px; }

body.s-success .blob { opacity: .13; }
body.s-success .blob-tl { background: radial-gradient(circle, #00c853, transparent 70%); }
body.s-success .blob-br { background: radial-gradient(circle, #00e676, transparent 70%); }

body.s-error .blob { opacity: .13; }
body.s-error .blob-tl { background: radial-gradient(circle, #c62828, transparent 70%); }
body.s-error .blob-br { background: radial-gradient(circle, #ff5252, transparent 70%); }

/* ── Card ── */
.card {
  position: relative;
  z-index: 1;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 26px;
  padding: 44px 28px 36px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 32px 64px rgba(0,0,0,.5);
}

/* ── States ── */
.state { display: none; }
.state.active {
  display: block;
  animation: stateIn .35s cubic-bezier(.16,1,.3,1) both;
}
@keyframes stateIn {
  from { opacity:0; transform:translateY(10px) scale(.98); }
  to   { opacity:1; transform:translateY(0)    scale(1);   }
}

/* ── Loading spinner ── */
.spin-wrap {
  width: 68px; height: 68px;
  margin: 0 auto 28px;
  position: relative;
}
.spin-track {
  width: 68px; height: 68px;
  border: 2.5px solid rgba(255,255,255,.06);
  border-radius: 50%;
}
.spin-head {
  position: absolute;
  inset: 0;
  border: 2.5px solid transparent;
  border-top-color: rgba(255,255,255,.55);
  border-right-color: rgba(255,255,255,.2);
  border-radius: 50%;
  animation: spin .65s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── SVG Icon ring ── */
.icon-svg-wrap {
  width: 84px; height: 84px;
  margin: 0 auto 26px;
}
.icon-svg-wrap svg { width:84px; height:84px; overflow:visible; }

/* ring */
.svg-ring {
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 230;
  stroke-dashoffset: 230;
  animation: drawRing .65s cubic-bezier(.4,0,.2,1) forwards .05s;
}
.svg-ring-success {
  stroke: var(--green);
  animation: drawRing .65s cubic-bezier(.4,0,.2,1) forwards .05s,
             glowPulse-g 2.4s ease-in-out infinite 1.4s;
}
.svg-ring-error {
  stroke: var(--red);
  animation: drawRing .65s cubic-bezier(.4,0,.2,1) forwards .05s,
             glowPulse-r 2.4s ease-in-out infinite 1.4s;
}
@keyframes drawRing { to { stroke-dashoffset: 0; } }

/* checkmark */
.svg-check {
  fill: none;
  stroke: var(--green);
  stroke-width: 2.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 52;
  stroke-dashoffset: 52;
  animation: drawCheck .4s cubic-bezier(.4,0,.2,1) forwards .62s;
  filter: drop-shadow(0 0 4px var(--green));
}
@keyframes drawCheck { to { stroke-dashoffset: 0; } }

/* X lines */
.svg-x {
  fill: none;
  stroke: var(--red);
  stroke-width: 2.8;
  stroke-linecap: round;
  filter: drop-shadow(0 0 4px var(--red));
}
.svg-x-1 { stroke-dasharray:38; stroke-dashoffset:38; animation: drawX .3s ease forwards .62s; }
.svg-x-2 { stroke-dasharray:38; stroke-dashoffset:38; animation: drawX .3s ease forwards .78s; }
@keyframes drawX { to { stroke-dashoffset: 0; } }

/* pulses */
@keyframes glowPulse-g {
  0%,100% { filter: drop-shadow(0 0 5px var(--green-glow)); }
  50%      { filter: drop-shadow(0 0 18px var(--green-glow)) drop-shadow(0 0 36px rgba(0,230,118,.14)); }
}
@keyframes glowPulse-r {
  0%,100% { filter: drop-shadow(0 0 5px var(--red-glow)); }
  50%      { filter: drop-shadow(0 0 18px var(--red-glow)) drop-shadow(0 0 36px rgba(255,79,79,.14)); }
}

/* ── Text ── */
.t-load  { font-size:1.05rem; font-weight:600; color:var(--text);  margin-bottom:8px; }
.t-sub   { font-size:.82rem;  color:var(--muted); line-height:1.6; }
.t-ok    { font-size:1.25rem; font-weight:700; color:var(--green); margin-bottom:20px; letter-spacing:-.2px; }
.t-err   { font-size:1.25rem; font-weight:700; color:var(--red);   margin-bottom:12px; letter-spacing:-.2px; }
.t-errmsg{ font-size:.84rem;  color:rgba(255,255,255,.45); line-height:1.65; margin-bottom:24px; padding:0 6px; }
.t-foot  { font-size:.7rem;   color:rgba(255,255,255,.18); margin-top:18px; line-height:1.5; }

/* ── User card ── */
.user-card {
  display: flex;
  align-items: center;
  gap: 13px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 15px;
  padding: 12px 15px;
  margin-bottom: 14px;
  text-align: left;
  animation: stateIn .4s ease both .8s;
}
.av-wrap { position:relative; flex-shrink:0; }
.av {
  width: 46px; height: 46px;
  border-radius: 50%;
  display: block;
  object-fit: cover;
  background: rgba(255,255,255,.05);
}
.av-ring {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2.5px solid var(--green);
  box-shadow: 0 0 12px var(--green-glow);
  animation: ringPulse 2.4s ease-in-out infinite 1.6s;
}
@keyframes ringPulse {
  0%,100% { box-shadow: 0 0 8px var(--green-glow); }
  50%      { box-shadow: 0 0 20px var(--green-glow), 0 0 38px rgba(0,230,118,.1); }
}
.av-info { flex:1; min-width:0; }
.av-name { font-size:.92rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.av-tag  { font-size:.73rem;  color:var(--muted); margin-top:2px; }

/* ── Role badge ── */
.role-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  background: rgba(0,230,118,.09);
  border: 1px solid rgba(0,230,118,.22);
  border-radius: 999px;
  font-size: .76rem;
  font-weight: 600;
  color: var(--green);
  margin-bottom: 14px;
  animation: stateIn .4s ease both .95s;
}

/* ── Buttons ── */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 13px;
  font-family: inherit;
  font-size: .9rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform .18s, box-shadow .18s;
  text-decoration: none;
  margin-top: 6px;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.98); }

.btn-go {
  background: var(--discord);
  color: #fff;
  box-shadow: 0 4px 20px rgba(88,101,242,.3);
  animation: stateIn .4s ease both 1.1s;
}
.btn-go:hover { box-shadow: 0 6px 28px rgba(88,101,242,.45); }

.btn-back {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.09);
  color: var(--text);
}
.btn-back:hover { background: rgba(255,255,255,.1); }
</style>
</head>
<body>
<div class="blob blob-tl"></div>
<div class="blob blob-br"></div>

<div class="card">

  <!-- Loading -->
  <div class="state active" id="s-loading">
    <div class="spin-wrap">
      <div class="spin-track"></div>
      <div class="spin-head"></div>
    </div>
    <p class="t-load">กำลังยืนยันตัวตน...</p>
    <p class="t-sub">กรุณารอสักครู่</p>
  </div>

  <!-- Success -->
  <div class="state" id="s-success">
    <div class="icon-svg-wrap">
      <svg viewBox="0 0 84 84">
        <circle class="svg-ring svg-ring-success" cx="42" cy="42" r="36"/>
        <polyline class="svg-check" points="25,42 36,54 59,28"/>
      </svg>
    </div>
    <p class="t-ok">ยืนยันตัวตนสำเร็จ!</p>

    <div class="user-card" id="user-card">
      <div class="av-wrap">
        <img class="av" id="av-img" src="" alt="">
        <div class="av-ring"></div>
      </div>
      <div class="av-info">
        <div class="av-name" id="av-name">—</div>
        <div class="av-tag"  id="av-tag">@—</div>
      </div>
    </div>

    <div class="role-pill" id="role-pill" style="display:none">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="role-pill-name"></span>
    </div>

    <p class="t-sub" id="ok-sub" style="margin-bottom:20px">ระบบเพิ่มยศให้เรียบร้อยแล้ว</p>

    <a class="btn btn-go" href="discord://">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.08.112 18.1.128 18.11a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 19.74 19.74 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.19.372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
      กลับไปที่ Discord
    </a>
    <p class="t-foot">ข้อมูลของคุณถูกบันทึกลงฐานข้อมูลเรียบร้อยแล้ว</p>
  </div>

  <!-- Error -->
  <div class="state" id="s-error">
    <div class="icon-svg-wrap">
      <svg viewBox="0 0 84 84">
        <circle class="svg-ring svg-ring-error" cx="42" cy="42" r="36"/>
        <line class="svg-x svg-x-1" x1="27" y1="27" x2="57" y2="57"/>
        <line class="svg-x svg-x-2" x1="57" y1="27" x2="27" y2="57"/>
      </svg>
    </div>
    <p class="t-err">ยืนยันตัวตนล้มเหลว</p>
    <p class="t-errmsg" id="err-msg">เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง</p>
    <button class="btn btn-back" onclick="location.reload()">↩ &nbsp;ลองใหม่อีกครั้ง</button>
  </div>

</div>

<script>
const p     = new URLSearchParams(location.search);
const code  = p.get('code');
const state = p.get('state');
const err   = p.get('error');

function show(id, theme) {
  document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
  document.getElementById('s-' + id).classList.add('active');
  document.body.className = 's-' + (theme || id);
}

function renderSuccess(d) {
  const u = d.user || {};
  const img = document.getElementById('av-img');
  img.src = u.avatarUrl || 'https://cdn.discordapp.com/embed/avatars/0.png';
  img.onerror = () => img.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
  document.getElementById('av-name').textContent = u.username || '—';
  document.getElementById('av-tag').textContent  = u.tag      || '';

  if (d.roleName) {
    document.getElementById('role-pill-name').textContent = d.roleName;
    document.getElementById('role-pill').style.display    = 'inline-flex';
  }
  if (d.message) document.getElementById('ok-sub').textContent = d.message;
  show('success', 'success');
}

function renderError(msg) {
  document.getElementById('err-msg').textContent = msg || 'เกิดข้อผิดพลาด กรุณาลองใหม่';
  show('error', 'error');
}

(async () => {
  if (err === 'access_denied') return renderError('คุณปฏิเสธการอนุญาต กรุณาลองใหม่อีกครั้ง');
  if (!code)                   return renderError('ไม่พบ Authorization Code กรุณาลองใหม่');
  try {
    const res  = await fetch('/auth/callback', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ code, state })
    });
    const data = await res.json();
    data.success ? renderSuccess(data) : renderError(data.error);
  } catch {
    renderError('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
  }
})();
</script>
</body>
</html>
