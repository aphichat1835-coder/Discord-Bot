<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ยืนยันตัวตน</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI','Noto Sans Thai',sans-serif;background:#07050f;color:#ede9fe;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
  .card{background:rgba(20,15,40,.9);border:1px solid rgba(120,80,255,.2);border-radius:20px;padding:48px 36px;text-align:center;max-width:420px;width:100%;box-shadow:0 16px 48px rgba(124,58,237,.15)}
  .icon{font-size:3.5rem;margin-bottom:16px}
  h2{font-size:1.3rem;margin-bottom:10px}
  p{color:#a78bfa;font-size:.88rem;line-height:1.6;margin-bottom:20px}
  .spinner{width:52px;height:52px;border:4px solid rgba(255,255,255,.1);border-top-color:#7c3aed;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 24px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{display:inline-block;padding:11px 28px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-size:.9rem;margin-top:8px;border:none;cursor:pointer}
  .success .icon{filter:drop-shadow(0 0 16px #4ade80)}
  .error   .icon{filter:drop-shadow(0 0 16px #f87171)}
  .detail{font-size:.78rem;color:#7c3aed88;margin-top:12px;background:rgba(124,58,237,.1);border-radius:8px;padding:8px 14px}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">กำลังยืนยันตัวตน...</h2>
  <p id="msg">กรุณารอสักครู่</p>
</div>

<script>
const params = new URLSearchParams(location.search);
const code   = params.get('code');
const state  = params.get('state');
const error  = params.get('error');

const card    = document.getElementById('card');
const spinner = document.getElementById('spinner');
const title   = document.getElementById('title');
const msg     = document.getElementById('msg');

function showSuccess(message) {
  spinner.style.display = 'none';
  card.className = 'card success';
  card.innerHTML = `
    <div class="icon">✅</div>
    <h2 style="color:#4ade80">ยืนยันตัวตนสำเร็จ!</h2>
    <p>${message}</p>
    <div class="detail">คุณสามารถปิดหน้าต่างนี้ได้แล้ว</div>`;
}

function showError(message) {
  spinner.style.display = 'none';
  card.className = 'card error';
  card.innerHTML = `
    <div class="icon">❌</div>
    <h2 style="color:#f87171">ยืนยันตัวตนล้มเหลว</h2>
    <p>${message}</p>
    <div class="detail">ปิดหน้าต่างนี้แล้วลองใหม่อีกครั้ง</div>`;
}

async function verify() {
  if (error === 'access_denied') return showError('คุณปฏิเสธการยืนยันตัวตน');
  if (!code) return showError('ไม่พบ Authorization Code กรุณาลองใหม่');

  try {
    const res  = await fetch('/auth/callback', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ code, state })
    });
    const data = await res.json();
    if (data.success) showSuccess(data.message || 'ยืนยันตัวตนสำเร็จ');
    else              showError(data.error   || 'เกิดข้อผิดพลาด กรุณาลองใหม่');
  } catch (e) {
    showError('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
  }
}

verify();
</script>
</body>
</html>
