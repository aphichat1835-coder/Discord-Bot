<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>กำลังเข้าสู่ระบบ...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0e0e1a;
      color: #e0e0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #5865f2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { color: #c9b6ff; margin-bottom: 8px; }
    p { color: #9090bb; font-size: 0.9rem; }
    .success { display: none; }
    .success .icon { font-size: 3rem; margin-bottom: 12px; }
    .error { display: none; color: #ff6b6b; margin-top: 16px; font-size: 0.9rem; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 28px;
      background: #5865f2;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading">
      <div class="spinner"></div>
      <h2>กำลังยืนยันตัวตน...</h2>
      <p>กรุณารอสักครู่</p>
    </div>

    <div class="success" id="success">
      <div class="icon">✅</div>
      <h2>ยืนยันตัวตนสำเร็จ!</h2>
      <p id="success-msg">คุณได้รับยศแล้ว กลับไปที่ Discord ได้เลย</p>
    </div>

    <div class="error" id="error-msg"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');

    async function handleCallback() {
      if (error) {
        showError('ยกเลิกการยืนยันตัวตน');
        return;
      }
      if (!code) {
        showError('ไม่พบ code จาก Discord');
        return;
      }

      try {
        const res = await fetch('/auth/callback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, state })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('loading').style.display = 'none';
          const s = document.getElementById('success');
          s.style.display = 'block';
          if (data.message) {
            document.getElementById('success-msg').textContent = data.message;
          }
        } else {
          showError(data.error || 'เกิดข้อผิดพลาด กรุณาลองใหม่');
        }
      } catch (err) {
        showError('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
      }
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error-msg');
      el.style.display = 'block';
      el.textContent = '❌ ' + msg;
    }

    handleCallback();
  </script>
</body>
</html>
