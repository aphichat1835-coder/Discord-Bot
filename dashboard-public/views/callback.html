<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ยืนยันตัวตน</title>
<style>
:root{
  --bg:#090b14;
  --card:#2c2d33ee;
  --line:#ffffff14;
  --text:#f2f4fb;
  --muted:#a8aab5;
  --green:#45e67a;
  --red:#ef4444;
  --discord:#5865f2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai',sans-serif;
  background:radial-gradient(circle at 55% 85%,#12472d 0,#111827 42%,#070912 100%);
  color:var(--text);
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:34px 18px;
}
.card{
  width:100%;
  max-width:390px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:34px 22px 28px;
  text-align:center;
  box-shadow:0 30px 80px #0008;
  backdrop-filter:blur(18px);
}
.state{display:none}
.state.active{display:block;animation:pop .25s ease both}
@keyframes pop{
  from{opacity:0;transform:translateY(10px) scale(.98)}
  to{opacity:1;transform:none}
}
.spinner{
  width:64px;
  height:64px;
  border-radius:50%;
  border:4px solid #ffffff18;
  border-top-color:#fff;
  margin:4px auto 24px;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.icon{
  width:86px;
  height:86px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 24px;
  font-size:38px;
  font-weight:900;
}
.icon.ok{
  color:#122016;
  background:#45e67a;
  box-shadow:0 0 0 5px #45e67a22;
}
.icon.err{
  color:#250b0b;
  background:#ef4444;
  box-shadow:0 0 0 5px #ef444422;
}
.ring{
  width:112px;
  height:112px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 26px;
}
.ring.ok{border:4px solid var(--green)}
.ring.err{border:4px solid var(--red)}
h1{
  font-size:1.45rem;
  margin-bottom:14px;
  font-weight:900;
}
.okText{color:var(--green)}
.errText{color:var(--red)}
p{
  color:var(--muted);
  line-height:1.65;
}
.user{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  background:#202127;
  border-radius:15px;
  margin:22px 16px;
  padding:14px;
  text-align:left;
}
.avatarWrap{position:relative}
.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  background:#111;
}
.avatarWrap:after{
  content:"";
  position:absolute;
  inset:-4px;
  border:3px solid var(--green);
  border-radius:50%;
}
.name{
  font-weight:800;
  font-size:1.05rem;
}
.tag{
  color:#8e919d;
  font-size:.88rem;
  margin-top:2px;
}
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px 18px;
  margin-top:22px;
  font-weight:900;
  font-size:1rem;
  text-decoration:none;
  color:#fff;
  cursor:pointer;
}
.btn.ok{
  background:var(--green);
  box-shadow:0 12px 34px #45e67a33;
}
.btn.err{
  background:#ffffff0b;
  border:1px solid #ffffff22;
}
.foot{
  font-size:.78rem;
  color:#8e919d;
  margin-top:20px;
}
</style>
</head>
<body>
<div class="card">

  <div class="state active" id="s-loading">
    <div class="spinner"></div>
    <h1>กำลังยืนยันตัวตน...</h1>
    <p>กรุณารอสักครู่</p>
  </div>

  <div class="state" id="s-success">
    <div class="ring ok">
      <div class="icon ok">✓</div>
    </div>
    <h1 class="okText">ยืนยันตัวตนสำเร็จ</h1>

    <div class="user">
      <div class="avatarWrap">
        <img class="avatar" id="av" alt="">
      </div>
      <div>
        <div class="name" id="name">—</div>
        <div class="tag" id="tag">—</div>
      </div>
    </div>

    <p id="ok-msg">ระบบเพิ่มยศให้เรียบร้อยแล้ว</p>
    <a class="btn ok" href="discord://">กลับไปที่ Discord</a>
    <div class="foot">ข้อมูลของคุณถูกบันทึกลงฐานข้อมูลเรียบร้อย</div>
  </div>

  <div class="state" id="s-error">
    <div class="ring err">
      <div class="icon err">×</div>
    </div>
    <h1 class="errText">เกิดข้อผิดพลาด</h1>
    <p id="err-msg">ไม่พบรหัสยืนยันตัวตน กรุณาลองใหม่อีกครั้ง</p>
    <button class="btn err" onclick="location.href='/'">กลับไปหน้าหลัก</button>
  </div>

</div>

<script>
const q = new URLSearchParams(location.search);
const code = q.get('code');
const state = q.get('state');
const error = q.get('error');

function show(id) {
  document.querySelectorAll('.state').forEach(e => e.classList.remove('active'));
  document.getElementById('s-' + id).classList.add('active');
}

function devicePayload() {
  let tz = 'unknown';

  try {
    tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown';
  } catch {}

  return {
    timezone: tz,
    language: navigator.language || 'unknown',
    platform: navigator.platform || 'unknown',
    screenSize: `${screen.width}x${screen.height}`
  };
}

function success(d) {
  const u = d.user || {};

  document.getElementById('av').src = u.avatarUrl || 'https://cdn.discordapp.com/embed/avatars/0.png';
  document.getElementById('name').textContent = u.username || '—';
  document.getElementById('tag').textContent = u.tag || '';

  if (d.message) {
    document.getElementById('ok-msg').textContent = d.message;
  }

  show('success');
}

function fail(msg) {
  document.getElementById('err-msg').textContent = msg || 'เกิดข้อผิดพลาด กรุณาลองใหม่';
  show('error');
}

(async () => {
  if (error === 'access_denied') {
    return fail('คุณปฏิเสธการอนุญาต กรุณาลองใหม่อีกครั้ง');
  }

  if (!code) {
    return fail('ไม่พบรหัสยืนยันตัวตน กรุณาลองใหม่อีกครั้ง');
  }

  try {
    const res = await fetch('/auth/callback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, state, ...devicePayload() })
    });

    const data = await res.json();

    data.success ? success(data) : fail(data.error);
  } catch {
    fail('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
  }
})();
</script>
</body>
</html>
