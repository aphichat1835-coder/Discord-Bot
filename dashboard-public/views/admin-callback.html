<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>กำลังเข้าสู่ระบบ...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI','Noto Sans Thai',sans-serif;background:#07050f;color:#ede9fe;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.1);border-top-color:#7c3aed;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{color:#a78bfa;text-align:center}
</style>
</head>
<body>
  <div><div class="spinner"></div><p>กำลังเข้าสู่ระบบ...</p></div>
  <script>
    const code  = new URLSearchParams(location.search).get('code');
    const state = new URLSearchParams(location.search).get('state');
    if (!code) { location.href = '/'; }
    else {
      fetch('/auth/admin-callback', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ code, state })
      })
      .then(r => r.json())
      .then(d => { if (d.success) location.href = d.redirect || '/guilds'; else location.href = '/'; })
      .catch(()  => location.href = '/');
    }
  </script>
</body>
</html>
