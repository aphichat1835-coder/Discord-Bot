<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>เลือกเซิร์ฟเวอร์</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI','Noto Sans Thai',sans-serif;background:#07050f;color:#ede9fe;min-height:100vh;padding:24px 16px}
  h1{text-align:center;font-size:1.4rem;font-weight:900;background:linear-gradient(135deg,#a855f7,#d8b4fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
  .sub{text-align:center;color:#7c3aed88;font-size:.82rem;margin-bottom:24px}
  .container{max-width:720px;margin:0 auto}
  .logout{display:block;text-align:right;color:#7c3aed88;font-size:.8rem;text-decoration:none;margin-bottom:16px}
  .logout:hover{color:#a78bfa}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .guild-card{background:rgba(20,15,40,.9);border:1px solid rgba(120,80,255,.2);border-radius:14px;padding:20px;text-align:center;cursor:pointer;text-decoration:none;color:#ede9fe;transition:all .2s}
  .guild-card:hover{border-color:rgba(168,85,247,.5);transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,.2)}
  .guild-icon{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 12px;overflow:hidden}
  .guild-icon img{width:100%;height:100%;object-fit:cover}
  .guild-name{font-weight:700;font-size:.95rem;margin-bottom:4px}
  .guild-id{font-size:.72rem;color:#7c3aed88;font-family:monospace}
  .loading{text-align:center;color:#a78bfa;padding:40px}
  .empty{text-align:center;color:#7c3aed88;padding:60px 20px}
</style>
</head>
<body>
<div class="container">
  <h1>🛡️ เลือกเซิร์ฟเวอร์</h1>
  <p class="sub">เซิร์ฟเวอร์ที่คุณมีสิทธิ์ Administrator</p>
  <a href="/logout" class="logout">ออกจากระบบ →</a>
  <div class="grid" id="grid"><div class="loading">กำลังโหลด...</div></div>
</div>

<script>
async function load() {
  const grid = document.getElementById('grid');
  try {
    const res   = await fetch('/api/guilds');
    const data  = await res.json();
    if (!data.success || !data.guilds?.length) {
      grid.innerHTML = '<div class="empty">ไม่พบเซิร์ฟเวอร์ที่มีสิทธิ์จัดการ<br><small>ต้องเป็น Administrator หรือ Owner</small></div>';
      return;
    }
    grid.innerHTML = data.guilds.map(g => {
      const iconUrl = g.icon
        ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.webp?size=128`
        : null;
      return `
        <a href="/guild/${g.id}" class="guild-card">
          <div class="guild-icon">
            ${iconUrl ? `<img src="${iconUrl}" alt="">` : '🏰'}
          </div>
          <div class="guild-name">${escapeHtml(g.name)}</div>
          <div class="guild-id">${g.id}</div>
        </a>`;
    }).join('');
  } catch (e) {
    grid.innerHTML = '<div class="empty">เกิดข้อผิดพลาด กรุณา refresh</div>';
  }
}

function escapeHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
