# Node's built-in test runner and node:assert are executed by CI, but Sonar's
# JavaScript S2699 analyzer does not recognize their assertions reliably. Keep
# every other rule enabled and suppress only this false positive in Node tests.
sonar.issue.ignore.multicriteria=nodeTestAssertions
sonar.issue.ignore.multicriteria.nodeTestAssertions.ruleKey=javascript:S2699
sonar.issue.ignore.multicriteria.nodeTestAssertions.resourceKey=discord/tests/**/*.test.js
