# Render Blueprint for Phomueangtai Enterprise Discord System
#
# This blueprint defines the single Render Web Service used by this project.
# It intentionally does NOT store secret environment values in the repo.
# The runtime has exactly 13 owner-maintained environment values, matching .env.example.
# All advanced runtime controls use code defaults unless intentionally overridden.
#
# IMPORTANT:
# - Confirm these service names match your existing Render services before syncing.
# - If the names do not match, Render may create new services instead of updating existing ones.
# - `branch: main` is the production Blueprint source. Change it deliberately if
#   a different release branch is intended; work on `tt` is not auto-deployed.
# - `autoDeployTrigger: off` requires an intentional Blueprint sync/deploy.
# - This file is documentation/deployment config only. It does not deploy anything by itself.

previews:
  generation: manual

services:
  # Bot + voice/session + Owner Dashboard + public OAuth verification callback
  - type: web
    runtime: node
    name: discord-bot-4hjp
    region: singapore
    plan: free
    branch: main
    rootDir: .
    buildCommand: npm install --global --ignore-scripts npm@12.0.1 && npm ci --ignore-scripts --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: TOKEN_MANAGER
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: API_SECRET
        sync: false
      - key: VERIFY_STATE_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DASHBOARD_PIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEBHOOK_LOG_URL
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
