name: CI

on:
  push:
    branches:
      - agent/batch-hardening-20260723

permissions:
  contents: write

concurrency:
  group: batch-hardening-recognized-ci
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ !contains(github.event.head_commit.message, '[batch-final]') && !contains(github.event.head_commit.message, '[batch-report]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.18.0

      - name: Bootstrap pinned npm
        run: |
          npm install --global --ignore-scripts npm@12.0.1
          test "$(npm --version)" = "12.0.1"

      - name: Install current dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore production CI baseline
        run: git show d41d9af4d4b656a7e5984aa0c7d84f729d601113:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Assemble batch patch
        run: |
          cat scripts/batch-hardening/part-*.txt > scripts/applyBatchFixes.js
          node --check scripts/applyBatchFixes.js

      - name: Apply complete source batch
        run: node scripts/applyBatchFixes.js

      - name: Install exact analysis dependencies
        run: npm install --save-dev --save-exact --ignore-scripts --no-audit --no-fund acorn@8.17.0 @sonar/scan@5.0.0

      - name: Preserve self-client architecture invariant
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies['discord.js-selfbot-v13']!=='^3.7.1') process.exit(1)"
          grep -q 'discord.js-selfbot-v13' package-lock.json

      - name: Protected path guard
        env:
          PROTECTED_BASE_SHA: d41d9af4d4b656a7e5984aa0c7d84f729d601113
        run: npm run check:protected

      - name: Protected syntax
        run: npm run check:protected-syntax

      - name: Discord syntax
        run: npm run check:all

      - name: Scripts syntax
        run: npm run check:scripts

      - name: Memory guards
        run: npm run check:memory-guards

      - name: Mongoose 9 compatibility
        run: npm run check:mongoose9 2>&1 | tee /tmp/batch-error.log

      - name: Discord tests and LCOV
        run: npm run test:coverage:discord 2>&1 | tee /tmp/batch-error.log

      - name: Voice tests and LCOV
        run: npm run test:coverage:voice 2>&1 | tee /tmp/batch-error.log

      - name: Verification tests and LCOV
        run: npm run test:coverage:verification 2>&1 | tee /tmp/batch-error.log

      - name: Verify coverage reports
        run: |
          test -s coverage/discord.lcov
          test -s coverage/voice.lcov
          test -s coverage/verification.lcov

      - name: Root dependency audit
        run: npm audit --audit-level=high 2>&1 | tee /tmp/batch-error.log

      - name: Diff validation
        run: |
          git diff --check
          if git diff --name-only d41d9af4d4b656a7e5984aa0c7d84f729d601113 -- discord/systemProvider.js discord/systemProvider | grep -q .; then
            echo "Protected system provider changed unexpectedly" >&2
            exit 1
          fi

      - name: Remove staging-only files
        run: |
          rm -f BATCH_VALIDATION_FAILURE.md
          rm -f .github/workflows/batch-hardening-v2.yml
          rm scripts/applyBatchFixes.js
          rm -rf scripts/batch-hardening

      - name: Commit validated staging tree
        env:
          BRANCH: agent/batch-hardening-20260723
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close runtime and quality gaps [batch-final]"
          git push origin "HEAD:$BRANCH"

      - name: Publish validation failure report
        if: failure()
        env:
          BRANCH: agent/batch-hardening-20260723
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          FAILED_SHA: ${{ github.sha }}
        run: |
          git reset --hard HEAD
          git clean -fdx
          {
            echo "# Batch validation failed"
            echo
            echo "- Run ID: $RUN_ID"
            echo "- Attempt: $RUN_ATTEMPT"
            echo "- Staging SHA: $FAILED_SHA"
            echo
            echo '```text'
            cat /tmp/batch-error.log 2>/dev/null || echo "No captured command output"
            echo '```'
          } > BATCH_VALIDATION_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BATCH_VALIDATION_FAILURE.md
          git commit -m "chore: publish batch validation failure [batch-report]"
          git push origin "HEAD:$BRANCH"
