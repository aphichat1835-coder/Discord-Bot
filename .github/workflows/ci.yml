name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Discord runtime dependencies
        run: node -e "require('discord.js'); require('@discordjs/voice'); console.log('discord runtime ok')"

      - name: Verify unified verification test runner
        run: node -e "require.resolve('jest-circus/runner'); require('jest-resolve'); console.log('verification jest ok')"

      - name: Protected path guard
        env:
          PROTECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:protected

      - name: Syntax check (Discord)
        run: npm run check:all

      - name: Syntax check (Scripts)
        run: npm run check:scripts

      - name: Memory guards check
        run: npm run check:memory-guards

      - name: Discord tests
        run: npm run test:discord

      - name: Voice tests
        run: npm run test:voice

      - name: Verification tests
        run: npm run test:verification

      - name: Root audit
        run: npm audit --audit-level=high
