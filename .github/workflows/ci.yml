name: Finalize complete snapshot redesign

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'tt' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: tt

      - name: Apply complete snapshot redesign
        run: |
          python3 scripts/applyCompleteSnapshotRedesign.py
          rm -f .github/workflows/export-snapshot-debug.yml

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run protected and syntax checks
        shell: bash
        run: |
          git fetch --no-tags origin main
          PROTECTED_BASE_SHA="$(git merge-base origin/main HEAD)" npm run check

      - name: Run all tests
        run: npm test

      - name: Run dependency audit
        run: npm audit --audit-level=high

      - name: Validate final diff
        run: git diff --check

      - name: Commit complete snapshot redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign snapshots for complete atomic storage"
          git push origin HEAD:tt
