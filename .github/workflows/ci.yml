name: Export validated snapshot redesign tree

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'tt' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: tt

      - name: Build validated final tree
        run: |
          python3 scripts/applyCompleteSnapshotRedesign.py
          rm -f .github/workflows/export-snapshot-debug.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign snapshots for complete atomic storage"
          git bundle create validated-snapshot-redesign.bundle HEAD

      - name: Upload validated tree
        uses: actions/upload-artifact@v4
        with:
          name: validated-snapshot-redesign
          path: validated-snapshot-redesign.bundle
          retention-days: 1
