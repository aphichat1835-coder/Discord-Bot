name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard-public/package-lock.json

      - name: Pin npm
        run: |
          npm install -g npm@10.9.2
          npm --version

      - name: Sync root lockfile
        run: npm install --package-lock-only --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Install root dependencies
        run: npm install --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Sync dashboard lockfile
        run: npm --prefix dashboard-public install --package-lock-only --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Install dashboard dependencies
        run: npm --prefix dashboard-public install --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: npm run check:all

      - name: Discord tests
        run: npm run test:discord

      - name: Root audit
        run: npm audit --omit=optional --audit-level=high

      - name: Dashboard tests
        run: npm --prefix dashboard-public test

      - name: Dashboard audit
        run: npm --prefix dashboard-public audit --omit=optional --audit-level=high
