name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Show tool versions
        run: |
          node --version
          npm --version
          npm cache clean --force

      - name: Sync root lockfile
        run: npm install --package-lock-only --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sync dashboard lockfile
        run: npm --prefix dashboard-public install --package-lock-only --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Install dashboard dependencies
        run: npm --prefix dashboard-public ci --ignore-scripts --no-audit --no-fund

      - name: Syntax check (Discord)
        run: npm run check:all

      - name: Syntax check (Dashboard)
        run: npm run check:dashboard:all

      - name: Syntax check (Scripts)
        run: npm run check:scripts

      - name: Memory guards check
        run: npm run check:memory-guards

      - name: Discord tests
        run: npm run test:discord

      - name: Root audit
        run: npm audit --omit=optional --audit-level=high

      - name: Dashboard tests
        run: npm --prefix dashboard-public test

      - name: Dashboard audit
        run: npm --prefix dashboard-public audit --omit=optional --audit-level=high
