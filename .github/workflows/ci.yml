name: Publish validated snapshot redesign code

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'tt' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: tt

      - name: Apply validated redesign
        run: |
          python3 scripts/applyCompleteSnapshotRedesign.py
          git checkout HEAD -- .github/workflows/ci.yml
          git checkout HEAD -- .github/workflows/export-snapshot-debug.yml
          git checkout HEAD -- .github/workflows/redesign-snapshot-storage.yml

      - name: Commit non-workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign snapshots for complete atomic storage"
          git push origin HEAD:tt
