name: Snapshot redesign diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: tt

      - name: Apply complete snapshot redesign
        run: python3 scripts/applyCompleteSnapshotRedesign.py

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused snapshot tests
        shell: bash
        run: |
          set +e
          npx jest --runInBand verification-tests/snapshotAggregateBudget.test.js verification-tests/snapshotChunkStore.test.js > snapshot-test.log 2>&1
          code=$?
          echo "$code" > snapshot-test.exit
          exit 0

      - name: Upload complete test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-test-log
          path: |
            snapshot-test.log
            snapshot-test.exit
          if-no-files-found: error

      - name: Fail when tests failed
        run: test "$(cat snapshot-test.exit)" = "0"
