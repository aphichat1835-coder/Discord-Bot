name: CI

on:
  push:
    branches:
      - main
      - ttt
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      REQUIRE_SONAR: ${{ vars.REQUIRE_SONAR }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.18.0

      - name: Bootstrap pinned npm
        run: |
          npm install --global --ignore-scripts npm@12.0.1
          test "$(npm --version)" = "12.0.1"

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Discord runtime dependencies
        run: node -e "require('discord.js'); require('@discordjs/voice'); console.log('discord runtime ok')"

      - name: Verify unified verification test runner
        run: node -e "require('node:test'); require('expect'); require('jest-mock'); console.log('verification node:test runner ok')"

      - name: Resolve protected diff base
        id: protected-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          is_commit() {
            local candidate="${1:-}"
            [ -n "$candidate" ] &&
              [[ ! "$candidate" =~ ^0+$ ]] &&
              git cat-file -e "${candidate}^{commit}" 2>/dev/null
          }

          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE_SHA"
          fi

          if ! is_commit "$base"; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              target_ref="${BASE_REF:-$DEFAULT_BRANCH}"
              git fetch --no-tags origin "$target_ref"
              base="$(git merge-base "origin/$target_ref" HEAD)"
            elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              git fetch --no-tags origin "$DEFAULT_BRANCH"
              base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)"
            elif git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
              base="$(git rev-parse HEAD^1)"
            fi
          fi

          if ! is_commit "$base"; then
            echo "::error::Unable to resolve a usable protected diff base."
            exit 1
          fi

          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Protected diff base: $base"

      - name: Protected path guard
        env:
          PROTECTED_BASE_SHA: ${{ steps.protected-base.outputs.sha }}
        run: npm run check:protected

      - name: Syntax check (Protected owner subsystem)
        run: npm run check:protected-syntax

      - name: Discord.js v14 compatibility guard
        run: npm run check:discord14

      - name: Secret leak guard
        run: npm run check:secrets

      - name: Syntax check (Discord)
        run: npm run check:all

      - name: Syntax check (Scripts)
        run: npm run check:scripts

      - name: Memory guards check
        run: npm run check:memory-guards

      - name: Mongoose 9 compatibility check
        run: npm run check:mongoose9

      - name: Discord tests with LCOV coverage
        run: npm run test:coverage:discord

      - name: Voice tests with LCOV coverage
        run: npm run test:coverage:voice

      - name: Verification tests with LCOV coverage
        run: npm run test:coverage:verification

      - name: Verify LCOV reports and thresholds
        run: npm run check:coverage

      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: npm run sonar -- -Dsonar.token="$SONAR_TOKEN"

      - name: SonarCloud degraded-status gate
        if: ${{ env.SONAR_TOKEN == '' }}
        shell: bash
        run: |
          echo "::warning::SONAR_TOKEN is unavailable; SonarCloud analysis is in visible degraded status."
          echo "### SonarCloud: degraded (SONAR_TOKEN unavailable)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${REQUIRE_SONAR,,}" = "true" ]; then
            echo "::error::REQUIRE_SONAR is enabled but SONAR_TOKEN is unavailable."
            exit 1
          fi

      - name: Root audit
        run: npm audit --audit-level=high
