name: Apply Final Non-Protected Hardening

on:
  push:
    branches:
      - fix/final-quality-gate-remediation
    paths:
      - scripts/applyFinalNonProtectedHardening.js
      - .github/workflows/apply-final-non-protected-hardening.yml
  pull_request:
    branches:
      - ttt.1
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: final-non-protected-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: ${{ github.head_ref == 'fix/final-quality-gate-remediation' || github.ref_name == 'fix/final-quality-gate-remediation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/final-quality-gate-remediation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.18.0

      - name: Apply final non-protected hardening
        run: node scripts/applyFinalNonProtectedHardening.js

      - name: Validate syntax
        run: |
          node --check discord/index/events.js
          node --check discord/voiceWorker/lifecycle.js
          node --check discord/verification/routes/guild.js
          node --check discord/verification/utils/oauthTokenLifecycle.js
          node --check scripts/checkSecretLeaks.js
          node --check scripts/checkDiscordV14Compatibility.js
          node --check scripts/checkCoverageThresholds.js
          node --check scripts/checkProtectedPaths.js

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run repository checks and full suites
        run: |
          npm run check:protected-syntax
          npm run check:discord14
          npm run check:secrets
          npm run check:all
          npm run check:scripts
          npm run check:memory-guards
          npm run check:mongoose9
          npm run test:coverage:discord
          npm run test:coverage:voice
          npm run test:coverage:verification
          npm run check:coverage
          npm audit --audit-level=high

      - name: Commit hardened source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            discord/index/events.js \
            discord/voiceWorker/lifecycle.js \
            discord/verification/routes/guild.js \
            discord/verification/utils/oauthTokenLifecycle.js \
            discord/tests/secretLeakGuard.test.js \
            discord/tests/coverageThresholds.test.js \
            scripts/checkSecretLeaks.js \
            scripts/checkDiscordV14Compatibility.js \
            scripts/checkCoverageThresholds.js \
            scripts/checkProtectedPaths.js
          if git diff --cached --quiet; then
            echo "No final hardening changes to commit"
            exit 0
          fi
          git commit -m "refactor: harden scanners and reduce reliability blockers"
          git push origin HEAD:fix/final-quality-gate-remediation
