name: TEMP audit and remove stale branches

on:
  pull_request:
    branches: [ttt.1]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Audit and remove stale branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CLEANUP_BRANCH: cleanup/audit-stale-branches-20260729
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          echo "=== Branches before cleanup ==="
          branches_file=$(mktemp)
          page=1
          : > "${branches_file}"
          while true; do
            response=$(api "https://api.github.com/repos/${REPOSITORY}/branches?per_page=100&page=${page}")
            count=$(jq 'length' <<<"${response}")
            jq -r '.[].name' <<<"${response}" >> "${branches_file}"
            [[ "${count}" -lt 100 ]] && break
            page=$((page + 1))
          done
          sort -u "${branches_file}" | tee /tmp/branches-before.txt

          echo "=== Open PR head branches preserved ==="
          open_heads_file=$(mktemp)
          page=1
          : > "${open_heads_file}"
          while true; do
            response=$(api "https://api.github.com/repos/${REPOSITORY}/pulls?state=open&per_page=100&page=${page}")
            count=$(jq 'length' <<<"${response}")
            jq -r --arg repo "${REPOSITORY}" '.[] | select(.head.repo.full_name == $repo) | .head.ref' <<<"${response}" >> "${open_heads_file}"
            [[ "${count}" -lt 100 ]] && break
            page=$((page + 1))
          done
          sort -u "${open_heads_file}" | tee /tmp/open-pr-heads.txt

          is_preserved() {
            local branch="$1"
            case "${branch}" in
              main|ttt|ttt.1|"${CLEANUP_BRANCH}") return 0 ;;
            esac
            grep -Fxq -- "${branch}" "${open_heads_file}"
          }

          echo "=== Deleting stale branches ==="
          deleted=0
          preserved=0
          while IFS= read -r branch; do
            [[ -z "${branch}" ]] && continue
            if is_preserved "${branch}"; then
              echo "PRESERVE ${branch}"
              preserved=$((preserved + 1))
              continue
            fi

            encoded=$(jq -rn --arg value "${branch}" '$value|@uri')
            status=$(curl --silent --show-error \
              --output /tmp/delete-response.json \
              --write-out "%{http_code}" \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${encoded}")
            if [[ "${status}" == "204" ]]; then
              echo "DELETED ${branch}"
              deleted=$((deleted + 1))
            else
              echo "FAILED ${branch} HTTP=${status}"
              cat /tmp/delete-response.json
              exit 1
            fi
          done < <(sort -u "${branches_file}")

          echo "=== Branches after stale cleanup ==="
          api "https://api.github.com/repos/${REPOSITORY}/branches?per_page=100" | jq -r '.[].name' | sort -u
          echo "SUMMARY deleted=${deleted} preserved=${preserved}"

          echo "=== Removing cleanup branch itself ==="
          cleanup_encoded=$(jq -rn --arg value "${CLEANUP_BRANCH}" '$value|@uri')
          status=$(curl --silent --show-error \
            --output /tmp/cleanup-delete-response.json \
            --write-out "%{http_code}" \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${cleanup_encoded}")
          [[ "${status}" == "204" ]] || { cat /tmp/cleanup-delete-response.json; exit 1; }
          echo "DELETED ${CLEANUP_BRANCH}"
