name: Apply Non-Protected Quality Fixes

on:
  push:
    branches:
      - fix/final-quality-gate-remediation
    paths:
      - scripts/applyNonProtectedQualityFixes.js
      - .github/workflows/apply-non-protected-quality-fixes.yml
  pull_request:
    branches:
      - ttt.1
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: non-protected-remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    if: ${{ github.head_ref == 'fix/final-quality-gate-remediation' || github.ref_name == 'fix/final-quality-gate-remediation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/final-quality-gate-remediation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.18.0

      - name: Apply scoped source fixes
        run: node scripts/applyNonProtectedQualityFixes.js

      - name: Validate syntax
        run: |
          node --check discord/features/protection.js
          node --check discord/guards/commandGuards.js
          node --check discord/index/joinCampaignRoutes.js
          node --check discord/commands/utility.js
          node --check discord/verification/routes/oauth.js
          node --check discord/tests/protectionConfig.test.js

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run focused and regression suites
        run: |
          node --test discord/tests/protectionConfig.test.js discord/tests/commandGuards.test.js
          npm run check:all
          npm run test:coverage:discord
          npm run test:coverage:verification
          npm run check:coverage

      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            discord/features/protection.js \
            discord/guards/commandGuards.js \
            discord/index/joinCampaignRoutes.js \
            discord/commands/utility.js \
            discord/verification/routes/oauth.js \
            discord/tests/protectionConfig.test.js \
            verification-tests/oauthSourceContracts.test.js
          if git diff --cached --quiet; then
            echo "No source fixes to commit"
            exit 0
          fi
          git commit -m "fix: harden input handling and clarify forced OAuth storage"
          git push origin HEAD:fix/final-quality-gate-remediation
