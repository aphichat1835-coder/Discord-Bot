name: ttt-final-review-fixes

on:
  push:
    branches: [ttt]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ttt
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.18.0
          cache: npm
      - name: Apply final review fixes
        shell: bash
        run: |
          cat > discord/core/readyInitialization.js <<'EOF'
          "use strict";

          function createReadyInitializationController(options = {}) {
              if (typeof options.initialize !== "function") throw new TypeError("initialize must be a function");
              const isReady = options.isReady || (() => true);
              const isShuttingDown = options.isShuttingDown || (() => false);
              const onError = options.onError || (() => {});
              const setTimer = options.setTimer || setTimeout;
              const clearTimer = options.clearTimer || clearTimeout;
              const requestedRetryMs = options.retryMs ?? 10000;
              const parsedRetryMs = Number(requestedRetryMs);
              const retryMs = Number.isFinite(parsedRetryMs)
                  ? Math.max(100, parsedRetryMs)
                  : 10000;
              let inFlight = null;
              let retryTimer = null;
              let completed = false;
              let stopped = false;
              let attempts = 0;
              let lastError = null;

              function clearRetry() {
                  if (!retryTimer) return;
                  clearTimer(retryTimer);
                  retryTimer = null;
              }

              function scheduleRetry() {
                  if (stopped || completed || retryTimer || isShuttingDown()) return false;
                  retryTimer = setTimer(() => {
                      retryTimer = null;
                      if (!stopped && !isShuttingDown() && isReady()) start();
                  }, retryMs);
                  retryTimer?.unref?.();
                  return true;
              }

              function start() {
                  if (stopped) return Promise.resolve(false);
                  if (completed) return Promise.resolve(true);
                  if (isShuttingDown() || !isReady()) return Promise.resolve(false);
                  if (inFlight) return inFlight;
                  attempts++;
                  inFlight = Promise.resolve()
                      .then(() => options.initialize())
                      .then(() => {
                          completed = true;
                          lastError = null;
                          clearRetry();
                          return true;
                      })
                      .catch(error => {
                          lastError = error;
                          onError(error, attempts);
                          scheduleRetry();
                          return false;
                      })
                      .finally(() => {
                          inFlight = null;
                      });
                  return inFlight;
              }

              function stop() {
                  stopped = true;
                  clearRetry();
              }

              function diagnostics() {
                  return {
                      completed,
                      stopped,
                      inFlight: Boolean(inFlight),
                      retryScheduled: Boolean(retryTimer),
                      retryMs,
                      attempts,
                      lastError: lastError?.code || lastError?.name || lastError?.message || null
                  };
              }

              return { start, stop, diagnostics };
          }

          module.exports = { createReadyInitializationController };
          EOF
          sed -i 's/^          //' discord/core/readyInitialization.js

          cat >> discord/tests/readyInitialization.test.js <<'EOF'

          test("retry delay rejects non-finite input and clamps zero", async () => {
              const invalidTimers = [];
              const invalid = createReadyInitializationController({
                  initialize: async () => { throw new Error("failure"); },
                  retryMs: "not-a-number",
                  setTimer(callback, delay) {
                      const timer = { callback, delay, unref() {} };
                      invalidTimers.push(timer);
                      return timer;
                  }
              });
              await invalid.start();
              assert.equal(invalidTimers[0].delay, 10000);
              invalid.stop();

              const zeroTimers = [];
              const zero = createReadyInitializationController({
                  initialize: async () => { throw new Error("failure"); },
                  retryMs: 0,
                  setTimer(callback, delay) {
                      const timer = { callback, delay, unref() {} };
                      zeroTimers.push(timer);
                      return timer;
                  }
              });
              await zero.start();
              assert.equal(zeroTimers[0].delay, 100);
              zero.stop();
          });

          test("stop prevents an in-flight failure from scheduling a retry", async () => {
              let rejectInitialization;
              const timers = [];
              const pending = new Promise((_, reject) => {
                  rejectInitialization = reject;
              });
              const controller = createReadyInitializationController({
                  initialize: () => pending,
                  setTimer(callback, delay) {
                      const timer = { callback, delay, unref() {} };
                      timers.push(timer);
                      return timer;
                  }
              });

              const startResult = controller.start();
              await new Promise(resolve => setImmediate(resolve));
              controller.stop();
              rejectInitialization(new Error("shutdown race"));

              assert.equal(await startResult, false);
              assert.equal(timers.length, 0);
              assert.equal(controller.diagnostics().stopped, true);
              assert.equal(controller.diagnostics().retryScheduled, false);
              assert.equal(await controller.start(), false);
          });
          EOF
          sed -i 's/^          //' discord/tests/readyInitialization.test.js

          cat > scripts/checkMongoose9Compatibility.js <<'EOF'
          "use strict";

          const fs = require("node:fs");
          const path = require("node:path");

          const EXCLUDED_DIRECTORIES = new Set(["node_modules", "tests", "public", "views"]);

          function walk(directory) {
              const files = [];
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                  const fullPath = path.join(directory, entry.name);
                  if (entry.isDirectory()) {
                      if (!EXCLUDED_DIRECTORIES.has(entry.name)) files.push(...walk(fullPath));
                  } else if (entry.isFile() && entry.name.endsWith(".js")) {
                      files.push(fullPath);
                  }
              }
              return files;
          }

          function lineAt(source, index) {
              return source.slice(0, index).split(/\r?\n/).length;
          }

          function findClosingParenthesis(source, openingIndex) {
              let depth = 0;
              let quote = null;
              let escaped = false;
              let lineComment = false;
              let blockComment = false;

              for (let index = openingIndex; index < source.length; index++) {
                  const character = source[index];
                  const next = source[index + 1];

                  if (lineComment) {
                      if (character === "\n") lineComment = false;
                      continue;
                  }
                  if (blockComment) {
                      if (character === "*" && next === "/") {
                          blockComment = false;
                          index++;
                      }
                      continue;
                  }
                  if (quote) {
                      if (escaped) escaped = false;
                      else if (character === "\\") escaped = true;
                      else if (character === quote) quote = null;
                      continue;
                  }
                  if (character === "/" && next === "/") {
                      lineComment = true;
                      index++;
                      continue;
                  }
                  if (character === "/" && next === "*") {
                      blockComment = true;
                      index++;
                      continue;
                  }
                  if (character === '"' || character === "'" || character === "`") {
                      quote = character;
                      continue;
                  }
                  if (character === "(") depth++;
                  else if (character === ")") {
                      depth--;
                      if (depth === 0) return index;
                  }
              }
              return -1;
          }

          function splitTopLevelArguments(source) {
              const argumentsList = [];
              let start = 0;
              let round = 0;
              let square = 0;
              let curly = 0;
              let quote = null;
              let escaped = false;

              for (let index = 0; index < source.length; index++) {
                  const character = source[index];
                  if (quote) {
                      if (escaped) escaped = false;
                      else if (character === "\\") escaped = true;
                      else if (character === quote) quote = null;
                      continue;
                  }
                  if (character === '"' || character === "'" || character === "`") {
                      quote = character;
                      continue;
                  }
                  if (character === "(") round++;
                  else if (character === ")") round--;
                  else if (character === "[") square++;
                  else if (character === "]") square--;
                  else if (character === "{") curly++;
                  else if (character === "}") curly--;
                  else if (character === "," && round === 0 && square === 0 && curly === 0) {
                      argumentsList.push(source.slice(start, index).trim());
                      start = index + 1;
                  }
              }
              argumentsList.push(source.slice(start).trim());
              return argumentsList.filter(Boolean);
          }

          function callbackParameters(expression) {
              const value = String(expression || "").trim();
              let match = value.match(/^(?:async\s+)?function(?:\s+[A-Za-z_$][\w$]*)?\s*\(([^)]*)\)/);
              if (!match) match = value.match(/^(?:async\s*)?\(([^)]*)\)\s*=>/);
              if (match) return match[1].split(",").map(item => item.trim()).filter(Boolean);
              match = value.match(/^(?:async\s+)?([A-Za-z_$][\w$]*)\s*=>/);
              return match ? [match[1]] : null;
          }

          function findMethodCalls(source) {
              const calls = [];
              const methodPattern = /\.(pre|post|doValidate|updateOne)\s*\(/g;
              let match;
              while ((match = methodPattern.exec(source))) {
                  const openingIndex = source.indexOf("(", match.index);
                  const closingIndex = findClosingParenthesis(source, openingIndex);
                  if (closingIndex < 0) continue;
                  calls.push({
                      method: match[1],
                      index: match.index,
                      args: splitTopLevelArguments(source.slice(openingIndex + 1, closingIndex))
                  });
                  methodPattern.lastIndex = closingIndex + 1;
              }
              return calls;
          }

          function analyzeSource(source, file = "inline") {
              const findings = [];
              for (const call of findMethodCalls(source)) {
                  if (call.method === "pre") {
                      const parameters = callbackParameters(call.args.at(-1));
                      if (parameters?.includes("next")) {
                          findings.push({ file, line: lineAt(source, call.index), code: "pre-middleware-next-callback" });
                      }
                      continue;
                  }
                  if (call.method === "post") continue;
                  const parameters = callbackParameters(call.args.at(-1));
                  if (!parameters) continue;
                  findings.push({
                      file,
                      line: lineAt(source, call.index),
                      code: call.method === "doValidate" ? "doValidate-callback" : "updateOne-callback"
                  });
              }
              return findings;
          }

          function scanRepository(root = "discord") {
              return walk(root).flatMap(file => analyzeSource(fs.readFileSync(file, "utf8"), file));
          }

          if (require.main === module) {
              const findings = scanRepository();
              if (findings.length) {
                  console.error("[MONGOOSE9] Removed callback-style API patterns detected:");
                  for (const item of findings) console.error(`- ${item.file}:${item.line} ${item.code}`);
                  process.exitCode = 1;
              } else {
                  console.log("[MONGOOSE9] Compatibility pattern check passed");
              }
          }

          module.exports = {
              analyzeSource,
              callbackParameters,
              findMethodCalls,
              splitTopLevelArguments
          };
          EOF
          sed -i 's/^          //' scripts/checkMongoose9Compatibility.js

          cat > discord/tests/mongoose9Compatibility.test.js <<'EOF'
          "use strict";

          const assert = require("node:assert/strict");
          const test = require("node:test");
          const { analyzeSource } = require("../../scripts/checkMongoose9Compatibility");

          function codes(source) {
              return analyzeSource(source).map(item => item.code);
          }

          test("Mongoose 9 scanner flags removed pre middleware next callbacks", () => {
              assert.deepEqual(codes('schema.pre("save", function(next) { next(); });'), [
                  "pre-middleware-next-callback"
              ]);
              assert.deepEqual(codes('schema.pre("save", true, next => next());'), [
                  "pre-middleware-next-callback"
              ]);
              assert.deepEqual(codes('schema.pre("save", { document: true }, (next) => next());'), [
                  "pre-middleware-next-callback"
              ]);
          });

          test("Mongoose 9 scanner allows supported post middleware next signatures", () => {
              assert.deepEqual(codes('schema.post("save", function(doc, next) { next(); });'), []);
          });

          test("Mongoose 9 scanner flags callback doValidate and updateOne forms", () => {
              assert.deepEqual(codes('schema.path("name").doValidate(value, function(error) {});'), [
                  "doValidate-callback"
              ]);
              assert.deepEqual(codes('Model.updateOne(filter, update, (error) => { done(error); });'), [
                  "updateOne-callback"
              ]);
              assert.deepEqual(codes('document.updateOne(update, async error => { report(error); });'), [
                  "updateOne-callback"
              ]);
          });

          test("Mongoose 9 scanner allows Promise-based middleware and updates", () => {
              assert.deepEqual(codes('schema.pre("save", async function() { await work(); });'), []);
              assert.deepEqual(codes('await Model.updateOne(filter, update, options);'), []);
          });
          EOF
          sed -i 's/^          //' discord/tests/mongoose9Compatibility.test.js

          rm .github/workflows/ttt-final-review-fixes.yml
      - name: Install dependencies
        run: |
          npm install --global --ignore-scripts npm@12.0.1
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate final review fixes
        run: |
          npm run check:all
          npm run check:scripts
          npm run check:memory-guards
          npm run check:mongoose9
          node --test discord/tests/readyInitialization.test.js discord/tests/mongoose9Compatibility.test.js
      - name: Commit final review fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix ready shutdown race and harden Mongoose compatibility scanner"
          git push origin HEAD:ttt
