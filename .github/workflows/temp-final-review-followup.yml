name: TEMP final review follow-up

on:
  pull_request:
    branches:
      - ttt.1

permissions:
  contents: write

concurrency:
  group: temp-final-review-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  implement:
    if: ${{ github.head_ref == 'fix/require-isolated-gate-pr71' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final review fixes
        run: python3 .github/scripts/temp_apply_final_review_followup.py

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate focused changes
        run: |
          node --check discord/index/system.js
          node --check discord/verification/routes/oauth.js
          node --check discord/verification/routes/guild.js
          node --test discord/tests/finalReviewContracts.test.js
          npm run check:scripts

      - name: Commit and push validated follow-up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord/index/system.js
          git add discord/verification/routes/oauth.js
          git add discord/verification/routes/guild.js
          git add discord/tests/finalReviewContracts.test.js
          git add ARCHITECTURE.md CHANGELOG.md
          git diff --cached --check
          git commit -m "fix: close final PR71 review gaps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
