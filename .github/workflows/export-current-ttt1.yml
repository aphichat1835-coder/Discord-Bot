name: Export Current TTT1

on:
  pull_request:
    branches:
      - ttt

permissions:
  contents: read

jobs:
  export:
    if: ${{ github.head_ref == 'ttt.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ttt.1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ttt.1
          fetch-depth: 0
          persist-credentials: false

      - name: Archive exact head
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/ttt1-current.tar.gz HEAD
          git rev-parse HEAD > /tmp/ttt1-current.sha
          sha256sum /tmp/ttt1-current.tar.gz > /tmp/ttt1-current.sha256

      - name: Upload archive
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v4.6.2
        with:
          name: ttt1-current-source-${{ github.sha }}
          path: |
            /tmp/ttt1-current.tar.gz
            /tmp/ttt1-current.sha
            /tmp/ttt1-current.sha256
          retention-days: 1
