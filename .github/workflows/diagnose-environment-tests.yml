name: Diagnose Environment Tests

on:
  pull_request:
    branches:
      - ttt

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.head_ref == 'ttt.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ttt.1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.18.0
      - name: Bootstrap pinned npm
        run: npm install --global --ignore-scripts npm@12.0.1
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture Discord suite
        id: tests
        shell: bash
        run: |
          set +e
          npm run test:coverage:discord > environment-tests.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 500 environment-tests.log
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: environment-test-diagnostics-${{ github.sha }}
          path: environment-tests.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failure status
        if: ${{ steps.tests.outputs.status != '0' }}
        run: exit 1
