name: Verify TTT1 Transfer Payload

on:
  pull_request:
    branches:
      - ttt

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.head_ref == 'ttt.1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ttt.1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ttt.1
          persist-credentials: false
      - name: Reconstruct payload for byte comparison
        run: |
          cat .github/ttt1-patch/chunk-* > github-reconstructed.patch.xz.b64
          wc -c github-reconstructed.patch.xz.b64 > github-reconstructed.size.txt
          sha256sum github-reconstructed.patch.xz.b64 > github-reconstructed.sha256.txt
      - name: Upload reconstructed payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ttt1-reconstructed-${{ github.sha }}
          path: |
            github-reconstructed.patch.xz.b64
            github-reconstructed.size.txt
            github-reconstructed.sha256.txt
          if-no-files-found: error
          retention-days: 1
