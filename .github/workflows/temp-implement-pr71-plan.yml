name: TEMP implement PR71 plan

on:
  pull_request:
    branches:
      - ttt.1

permissions:
  contents: write

concurrency:
  group: temp-implement-pr71-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  implement:
    if: ${{ github.head_ref == 'fix/require-isolated-gate-pr71' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize deterministic patch script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/temp_apply_pr71_plan.py')
          text = path.read_text()

          def replace_call(label, replacement):
              global text
              end_marker = f'    "{label}",\n)\n'
              end = text.find(end_marker)
              if end < 0:
                  raise SystemExit(f'missing script call label: {label}')
              end += len(end_marker)
              start = text.rfind('backup_test = replace_once(', 0, end)
              if start < 0:
                  raise SystemExit(f'missing script call start: {label}')
              text = text[:start] + replacement + text[end:]

          replace_call(
              'resolved overwrite expectation',
              '''stats_expectation = "        skippedRoleMissing: 1,\\n        skippedMemberMissing: 1\\n    });"\nrequire(\n    backup_test.count(stats_expectation) == 2,\n    f"restore stats expectations: expected 2, found {backup_test.count(stats_expectation)}",\n)\nbackup_test = backup_test.replace(\n    stats_expectation,\n    "        skippedRoleMissing: 1,\\n        skippedMemberMissing: 1,\\n        skippedMemberUnresolved: 0\\n    });",\n)\n'''
          )
          replace_call('aggregate stats expectation', '')
          path.write_text(text)
          PY

      - name: Apply reviewed implementation
        run: python3 .github/scripts/temp_apply_pr71_plan.py

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate focused changes
        run: |
          node --check discord/commands/utility.js
          node --test discord/tests/isolatedEnvironmentGate.test.js discord/tests/backupRestore.test.js
          npm run check:scripts

      - name: Commit and push validated code and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord/commands/utility.js
          git add discord/tests/isolatedEnvironmentGate.test.js
          git add discord/tests/backupRestore.test.js
          git diff --cached --check
          git commit -m "fix: resolve uncached restore members"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
