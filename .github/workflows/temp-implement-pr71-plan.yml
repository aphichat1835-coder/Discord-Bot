name: TEMP implement PR71 plan

on:
  pull_request:
    branches:
      - ttt.1

permissions:
  contents: write

concurrency:
  group: temp-implement-pr71-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  implement:
    if: ${{ github.head_ref == 'fix/require-isolated-gate-pr71' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed implementation
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 .github/scripts/temp_apply_pr71_plan.py 2>&1 | tee artifacts/pr71-patch.log

      - name: Upload patch diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr71-patch-diagnostics-${{ github.event.pull_request.head.sha }}
          path: artifacts/pr71-patch.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop when patch failed
        if: ${{ steps.apply.outcome != 'success' }}
        run: exit 1

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate focused changes
        run: |
          node --check discord/commands/utility.js
          node --test discord/tests/isolatedEnvironmentGate.test.js discord/tests/backupRestore.test.js
          npm run check:scripts

      - name: Commit validated implementation and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-implement-pr71-plan.yml
          rm -f .github/workflows/temp-implement-pr71-plan-v2.yml
          rm -f .github/workflows/temp-implement-pr71-push.yml
          rm -f .github/scripts/temp_apply_pr71_plan.py
          rm -f .github/.temp-pr71-trigger
          rm -rf artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: require isolated gate and resolve restore members"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
