name: TTT1 Discovery

on:
  push:
    branches:
      - ttt.1
  pull_request:
    branches:
      - ttt

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > audited-head.txt
          git ls-files | sort > repository-files.txt
          git archive --format=tar.gz --output=ttt1-source.tar.gz HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ttt1-source-${{ github.sha }}
          path: |
            ttt1-source.tar.gz
            repository-files.txt
            audited-head.txt
          if-no-files-found: error
          retention-days: 1
