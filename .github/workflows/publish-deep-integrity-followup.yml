name: Publish Deep Integrity Follow-up

on:
  push:
    branches:
      - codex/deep-integrity-followup-20260715
  pull_request:
    branches:
      - tt

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.deep-integrity-followup.piece* > /tmp/followup.patch
          echo "9e473de9b9554e3990325e34791f606776dbe819f4c2fadbcd665bfd00d16461  /tmp/followup.patch" | sha256sum -c -

      - name: Apply to exact tt head
        shell: bash
        env:
          EXPECTED_BASE: 5152ee11bee628b0ef63b4133efe4f6780f5ef2a
        run: |
          set -euo pipefail
          git fetch origin tt
          test "$(git rev-parse origin/tt)" = "$EXPECTED_BASE"
          git checkout --detach "$EXPECTED_BASE"
          git apply --exclude=verification-tests/ipIdentityHistory.test.js /tmp/followup.patch
          python - <<'PY'
          from pathlib import Path
          path = Path("verification-tests/ipIdentityHistory.test.js")
          text = path.read_text(encoding="utf-8")
          old = '''        expect(history._test.roleEventFilter({ ...base, roles: ["3", "1", "2", "1"] }))
                      .toEqual({ eventId: { $in: compatible } });
          '''
          new = '''        expect(history._test.roleEventIdentity({ ...base, roles: ["3", "1", "2", "1"] })).toEqual({
                      guildId: base.guildId,
                      ipHash: base.ipHash,
                      userId: base.userId,
                      roleId: base.roleId,
                      result: base.result,
                      at: base.at,
                      roles: { $all: ["1", "2", "3"], $size: 3 }
                  });
                  expect(history._test.roleEventFilter({ ...base, roles: ["3", "1", "2", "1"] })).toEqual({
                      $or: [
                          { eventId: { $in: compatible } },
                          history._test.roleEventIdentity({ ...base, roles: ["3", "1", "2", "1"] })
                      ]
                  });
          '''
          if text.count(old) != 1:
              raise SystemExit("role expectation anchor mismatch")
          text = text.replace(old, new, 1)
          marker = '    test("rejects non-snowflake history lookup identifiers before database access", () => {'
          if text.count(marker) != 1:
              raise SystemExit("role test insertion anchor mismatch")
          before, after = text.split(marker, 1)
          before = before.rstrip("\n") + "\n\n\n"
          extra = '''    test("role filters match legacy records even when their stored role order differs", () => {
              const base = {
                  guildId: "12345678901234567",
                  ipHash: "ip-hash",
                  userId: "22345678901234567",
                  roleId: "32345678901234567",
                  result: "success",
                  at: 100,
                  roles: ["3", "1", "2"]
              };
              const filter = history._test.roleEventFilter(base);
              expect(filter.$or[1]).toEqual({
                  guildId: base.guildId,
                  ipHash: base.ipHash,
                  userId: base.userId,
                  roleId: base.roleId,
                  result: base.result,
                  at: base.at,
                  roles: { $all: ["1", "2", "3"], $size: 3 }
              });
              expect(history._test.roleEventIdentity({ ...base, roles: [] }).roles).toEqual({ $size: 0 });
          });

          '''
          path.write_text(before + extra + marker + after, encoding="utf-8")
          PY
          git diff --check

      - name: Verify exact scope and blobs
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          discord/logging/modCaseManager.js
          discord/tests/modCaseManager.test.js
          discord/verification/routes/oauth.js
          discord/verification/services/ipIdentityHistoryService.js
          verification-tests/ipIdentityHistory.test.js
          EOF
          sed -i 's/^          //' /tmp/expected-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          ! grep -Eq '^discord/systemProvider(\.js|/)' /tmp/actual-files
          ! grep -Eq '^package(-lock)?\.json$' /tmp/actual-files
          ! grep -Eq '^\.github/workflows/' /tmp/actual-files
          test "$(git hash-object discord/logging/modCaseManager.js)" = "8bcfcff0ddec93308a9305169bdcbd5f026d452b"
          test "$(git hash-object discord/tests/modCaseManager.test.js)" = "a48c5e6cdc167a1f3a79733a52e97a881b73b4e0"
          test "$(git hash-object discord/verification/routes/oauth.js)" = "d17569811ed142733fefe8fd6207e2ea277e0546"
          test "$(git hash-object discord/verification/services/ipIdentityHistoryService.js)" = "5d7a66fab68966d3a10cc98be73d7ab4e9025252"
          test "$(git hash-object verification-tests/ipIdentityHistory.test.js)" = "81d6745a5e29e1ca663789fedb9559e2e4a3d0c3"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without lockfile changes
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund

      - name: Run repository checks
        run: CI=false npm run check

      - name: Run complete test suite
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Recheck final tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/final-files
          diff -u /tmp/expected-files /tmp/final-files
          test "$(git hash-object discord/logging/modCaseManager.js)" = "8bcfcff0ddec93308a9305169bdcbd5f026d452b"
          test "$(git hash-object discord/tests/modCaseManager.test.js)" = "a48c5e6cdc167a1f3a79733a52e97a881b73b4e0"
          test "$(git hash-object discord/verification/routes/oauth.js)" = "d17569811ed142733fefe8fd6207e2ea277e0546"
          test "$(git hash-object discord/verification/services/ipIdentityHistoryService.js)" = "5d7a66fab68966d3a10cc98be73d7ab4e9025252"
          test "$(git hash-object verification-tests/ipIdentityHistory.test.js)" = "81d6745a5e29e1ca663789fedb9559e2e4a3d0c3"

      - name: Commit and fast-forward tt
        shell: bash
        env:
          EXPECTED_BASE: 5152ee11bee628b0ef63b4133efe4f6780f5ef2a
        run: |
          set -euo pipefail
          git fetch origin tt
          test "$(git rev-parse origin/tt)" = "$EXPECTED_BASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $(cat /tmp/expected-files)
          git diff --cached --check
          git commit -m "Complete self-audited integrity safeguards"
          git push origin HEAD:tt
