name: ttt-mongoose9-gate

on:
  push:
    branches: [ttt]

permissions:
  contents: write

jobs:
  gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ttt
          fetch-depth: 0
      - name: Add compatibility checker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(name): return Path(name).read_text(encoding="utf-8")
          def write(name, content):
              target = Path(name); target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")
          def replace(name, old, new):
              text = read(name)
              if old not in text: raise SystemExit(f"expected Mongoose gate pattern not found: {name}")
              write(name, text.replace(old, new, 1))

          write("scripts/checkMongoose9Compatibility.js", '''"use strict";

          const fs = require("node:fs");
          const path = require("node:path");

          const ROOTS = ["discord"];
          const EXCLUDED_DIRECTORIES = new Set(["node_modules", "tests", "public", "views"]);
          const findings = [];

          function walk(directory) {
              const files = [];
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                  const fullPath = path.join(directory, entry.name);
                  if (entry.isDirectory()) {
                      if (!EXCLUDED_DIRECTORIES.has(entry.name)) files.push(...walk(fullPath));
                  } else if (entry.isFile() && entry.name.endsWith(".js")) files.push(fullPath);
              }
              return files;
          }

          function lineAt(source, index) {
              return source.slice(0, index).split(/\r?\n/).length;
          }

          function record(file, source, code, match) {
              findings.push({ file, line: lineAt(source, match.index), code });
          }

          function scanMiddlewareCallbacks(file, source) {
              const hook = /\.(?:pre|post)\s*\(/g;
              let match;
              while ((match = hook.exec(source))) {
                  const window = source.slice(match.index, match.index + 800);
                  if (/function\s*\([^)]*\bnext\b[^)]*\)/s.test(window) ||
                      /\([^)]*\bnext\b[^)]*\)\s*=>/s.test(window)) {
                      record(file, source, "middleware-next-callback", match);
                  }
              }
          }

          function scanRemovedCallbackApis(file, source) {
              const rules = [
                  ["doValidate-callback", /\.doValidate\s*\([^;]{0,500},\s*(?:function\b|\([^)]*\)\s*=>)/gs],
                  ["document-updateOne-callback", /\bthis\.updateOne\s*\([^;]{0,500},\s*(?:function\b|\([^)]*\)\s*=>)/gs]
              ];
              for (const [code, pattern] of rules) {
                  pattern.lastIndex = 0;
                  let match;
                  while ((match = pattern.exec(source))) record(file, source, code, match);
              }
          }

          function scanUpdatePipelines(file, source) {
              const pipeline = /\.(?:updateOne|updateMany|findOneAndUpdate)\s*\([^,]+,\s*\[/gs;
              let match;
              while ((match = pipeline.exec(source))) {
                  const window = source.slice(match.index, match.index + 1600);
                  if (!/updatePipeline\s*:\s*true/.test(window)) {
                      record(file, source, "update-pipeline-without-updatePipeline", match);
                  }
              }
          }

          for (const root of ROOTS) {
              for (const file of walk(root)) {
                  const source = fs.readFileSync(file, "utf8");
                  scanMiddlewareCallbacks(file, source);
                  scanRemovedCallbackApis(file, source);
                  scanUpdatePipelines(file, source);
              }
          }

          if (findings.length) {
              console.error("[MONGOOSE9] removed or changed API patterns detected:");
              for (const item of findings) console.error(`- ${item.file}:${item.line} ${item.code}`);
              process.exitCode = 1;
          } else {
              console.log("[MONGOOSE9] compatibility pattern check passed");
          }
          '''.replace("          ", ""))

          replace("package.json",
              '    "check": "npm run check:protected && npm run check:protected-syntax && npm run check:all && npm run check:scripts && npm run check:memory-guards",\n',
              '    "check": "npm run check:protected && npm run check:protected-syntax && npm run check:all && npm run check:scripts && npm run check:memory-guards && npm run check:mongoose9",\n')
          replace("package.json",
              '    "check:memory-guards": "node scripts/checkMemoryGuards.js",\n',
              '    "check:memory-guards": "node scripts/checkMemoryGuards.js",\n    "check:mongoose9": "node scripts/checkMongoose9Compatibility.js",\n')
          replace(".github/workflows/ci.yml",
              '''      - name: Memory guards check\n        run: npm run check:memory-guards\n\n      - name: Discord tests\n''',
              '''      - name: Memory guards check\n        run: npm run check:memory-guards\n\n      - name: Mongoose 9 compatibility check\n        run: npm run check:mongoose9\n\n      - name: Discord tests\n''')
          replace(".replit",
              '''[[workflows.workflow.tasks]]\ntask = "workflow.run"\nargs = "memory-guards"\n\n[[workflows.workflow.tasks]]\ntask = "workflow.run"\nargs = "test-discord"\n''',
              '''[[workflows.workflow.tasks]]\ntask = "workflow.run"\nargs = "memory-guards"\n\n[[workflows.workflow.tasks]]\ntask = "workflow.run"\nargs = "mongoose9-compat"\n\n[[workflows.workflow.tasks]]\ntask = "workflow.run"\nargs = "test-discord"\n''')
          replit = read(".replit")
          if 'name = "mongoose9-compat"' not in replit:
              replit += '''\n\n[[workflows.workflow]]\nname = "mongoose9-compat"\nauthor = "agent"\n\n[[workflows.workflow.tasks]]\ntask = "shell.exec"\nargs = "npm run check:mongoose9"\n\n[workflows.workflow.metadata]\nisValidation = true\n'''
              write(".replit", replit)

          Path(".github/workflows/ttt-mongoose9-gate.yml").unlink()
          PY
      - name: Validate checker before commit
        run: |
          node --check scripts/checkMongoose9Compatibility.js
          node scripts/checkMongoose9Compatibility.js
          node --check discord/core/bootLifecycle.js
          node --check discord/core/readyInitialization.js
          node --check discord/core/timers.js
      - name: Commit compatibility gate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: add permanent Mongoose 9 compatibility gate"
          git push origin HEAD:ttt
