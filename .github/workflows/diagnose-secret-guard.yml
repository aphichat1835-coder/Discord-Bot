name: Diagnose Secret Guard

on:
  pull_request:
    branches:
      - ttt

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.head_ref == 'ttt.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ttt.1
          persist-credentials: false
      - name: Run secret guard and capture redacted output
        id: guard
        shell: bash
        run: |
          set +e
          node scripts/checkSecretLeaks.js > secret-guard.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat secret-guard.log
          exit 0
      - name: Upload redacted diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ttt1-secret-guard-${{ github.sha }}
          path: secret-guard.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve guard result
        if: ${{ steps.guard.outputs.status != '0' }}
        run: exit 1
