name: ttt-policy-and-mongoose

on:
  push:
    branches: [ttt]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ttt
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.18.0
          cache: npm
      - name: Apply policy and compatibility gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(name): return Path(name).read_text(encoding="utf-8")
          def write(name, content):
              target = Path(name); target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")
          def replace(name, old, new):
              text = read(name)
              if old not in text: raise SystemExit(f"expected compatibility pattern not found: {name}")
              write(name, text.replace(old, new, 1))
          def append(name, marker, block):
              text = read(name)
              if marker in text: return
              write(name, text.rstrip() + "\n\n" + block.strip() + "\n")

          write("scripts/checkMongoose9Compatibility.js", '''"use strict";
          const fs = require("node:fs");
          const path = require("node:path");
          const findings = [];
          const rules = [
              { code: "middleware-next-callback", pattern: /\.(?:pre|post)\s*\([^;]{0,500}?function\s*\([^)]*\bnext\b[^)]*\)/gs },
              { code: "middleware-next-arrow", pattern: /\.(?:pre|post)\s*\([^;]{0,500}?\([^)]*\bnext\b[^)]*\)\s*=>/gs },
              { code: "doValidate-callback", pattern: /\.doValidate\s*\([^)]*,\s*(?:function|\([^)]*\)\s*=>)/gs },
              { code: "updateOne-callback", pattern: /\.updateOne\s*\([^;]{0,500}?,\s*(?:function|\([^)]*\)\s*=>)\s*\)/gs }
          ];
          function walk(directory) {
              const files = [];
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                  const full = path.join(directory, entry.name);
                  if (entry.isDirectory()) files.push(...walk(full));
                  else if (entry.isFile() && entry.name.endsWith(".js")) files.push(full);
              }
              return files;
          }
          for (const file of walk("discord")) {
              const source = fs.readFileSync(file, "utf8");
              for (const rule of rules) {
                  rule.pattern.lastIndex = 0;
                  const match = rule.pattern.exec(source);
                  if (!match) continue;
                  findings.push({ file, line: source.slice(0, match.index).split(/\r?\n/).length, code: rule.code });
              }
          }
          if (findings.length) {
              console.error("[MONGOOSE9] incompatible removed callback patterns detected");
              for (const item of findings) console.error(`- ${item.file}:${item.line} ${item.code}`);
              process.exitCode = 1;
          } else console.log("[MONGOOSE9] compatibility pattern check passed");
          '''.replace("          ", ""))

          replace("package.json",
              '    "check:memory-guards": "node scripts/checkMemoryGuards.js",\n',
              '    "check:memory-guards": "node scripts/checkMemoryGuards.js",\n    "check:mongoose9": "node scripts/checkMongoose9Compatibility.js",\n')
          replace("package.json",
              '    "check": "npm run check:protected && npm run check:protected-syntax && npm run check:all && npm run check:scripts && npm run check:memory-guards",\n',
              '    "check": "npm run check:protected && npm run check:protected-syntax && npm run check:all && npm run check:scripts && npm run check:memory-guards && npm run check:mongoose9",\n')
          replace(".github/workflows/ci.yml",
              '''      - name: Memory guards check\n        run: npm run check:memory-guards\n\n      - name: Discord tests\n''',
              '''      - name: Memory guards check\n        run: npm run check:memory-guards\n\n      - name: Mongoose 9 compatibility check\n        run: npm run check:mongoose9\n\n      - name: Discord tests\n''')
          replace(".replit",
              '''[[workflows.workflow.tasks]]\ntask = "workflow.run"\nargs = "memory-guards"\n\n[[workflows.workflow.tasks]]\ntask = "workflow.run"\nargs = "test-discord"\n''',
              '''[[workflows.workflow.tasks]]\ntask = "workflow.run"\nargs = "memory-guards"\n\n[[workflows.workflow.tasks]]\ntask = "workflow.run"\nargs = "mongoose9-compat"\n\n[[workflows.workflow.tasks]]\ntask = "workflow.run"\nargs = "test-discord"\n''')
          append(".replit", 'name = "mongoose9-compat"', '''[[workflows.workflow]]
          name = "mongoose9-compat"
          author = "agent"

          [[workflows.workflow.tasks]]
          task = "shell.exec"
          args = "npm run check:mongoose9"

          [workflows.workflow.metadata]
          isValidation = true'''.replace("          ", ""))

          policy = '''## Owner-approved self-client dependency

          `discord.js-selfbot-v13` is an intentional, owner-approved architecture dependency for the isolated Voice account/session subsystem. The current project has no compatible replacement that preserves this required behavior. This is not an accidental leftover or an unapproved migration target.

          Agents and maintainers must not remove, replace, migrate, rename, upgrade, or “modernize” this dependency or its library-specific API usage unless the repository owner gives a new explicit instruction for that exact change. Main-bot `discord.js` upgrades must remain isolated from the self-client package. The authoritative policy is `docs/SELF_CLIENT_POLICY.md`.
          '''.replace("          ", "")
          for document in ["README.md", "ARCHITECTURE.md", "CONTEXT.md", "SECURITY.md", "ROADMAP.md",
                           "CHANGELOG.md", "AGENTS.md", ".github/copilot-instructions.md", "docs/RUNBOOK.md"]:
              append(document, "## Owner-approved self-client dependency", policy)

          Path(".github/workflows/ttt-policy-and-mongoose.yml").unlink()
          PY
      - name: Install dependencies
        run: |
          npm install --global --ignore-scripts npm@12.0.1
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate policy and gate
        run: |
          npm run check
          npm run test:discord
          npm audit --audit-level=high
      - name: Commit policy and gate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "document owner-approved self-client policy and gate Mongoose 9"
          git push origin HEAD:ttt
