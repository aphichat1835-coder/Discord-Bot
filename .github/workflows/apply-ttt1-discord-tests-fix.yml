name: Apply TTT1 Discord Test Remediation

on:
  pull_request:
    branches:
      - ttt

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'ttt.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ttt.1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ttt.1
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct and apply remediation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ttt1-discord-tests-fix/part-* > /tmp/discord-tests-fix.patch.xz.b64
          echo "4e3e2f00b66ccd4b6bb3e97f19f6224cf20f4af4266ee01396afc4422c88f051  /tmp/discord-tests-fix.patch.xz.b64" | sha256sum -c -
          base64 --decode /tmp/discord-tests-fix.patch.xz.b64 > /tmp/discord-tests-fix.patch.xz
          echo "1c388d74a835a1216bc2baf08494d3e8e98f355bd8d33e3fdbf1cd1a8d84df93  /tmp/discord-tests-fix.patch.xz" | sha256sum -c -
          xz --decompress --stdout /tmp/discord-tests-fix.patch.xz > /tmp/discord-tests-fix.patch
          echo "77ffa5cf8f2ee24ef22d9c34ca81b1ca3f32a601162be2cba84dd8efcf06227c  /tmp/discord-tests-fix.patch" | sha256sum -c -
          git apply --check --index /tmp/discord-tests-fix.patch
          git apply --index /tmp/discord-tests-fix.patch
          git rm -r .github/ttt1-discord-tests-fix
      - name: Commit and push remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Coding Agent"
          git config user.email "noreply@openai.com"
          git commit -m "test: align Discord v14 mocks and protected trace contracts"
          git push origin HEAD:ttt.1
