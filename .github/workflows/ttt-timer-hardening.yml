name: ttt-timer-hardening

on:
  push:
    branches: [ttt]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ttt
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.18.0
          cache: npm
      - name: Apply timer hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(name):
              return Path(name).read_text(encoding="utf-8")

          def write(name, content):
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace(name, old, new):
              text = read(name)
              if old not in text:
                  raise SystemExit(f"expected timer pattern not found: {name}")
              write(name, text.replace(old, new, 1))

          write("discord/core/timers.js", '''"use strict";

          function normalizeDelay(ms) {
              return Math.max(0, Number(ms) || 0);
          }

          function delay(ms, value = undefined) {
              return new Promise(resolve => {
                  setTimeout(() => resolve(value), normalizeDelay(ms));
              });
          }

          async function withTimeoutValue(promise, timeoutMs, timeoutValue) {
              let timer = null;
              try {
                  return await Promise.race([
                      Promise.resolve(promise).finally(() => {
                          if (timer) clearTimeout(timer);
                      }),
                      new Promise(resolve => {
                          timer = setTimeout(() => resolve(timeoutValue), normalizeDelay(timeoutMs));
                      })
                  ]);
              } finally {
                  if (timer) clearTimeout(timer);
              }
          }

          async function withTimeoutReject(promise, timeoutMs, message) {
              let timer = null;
              try {
                  return await Promise.race([
                      Promise.resolve(promise).finally(() => {
                          if (timer) clearTimeout(timer);
                      }),
                      new Promise((_, reject) => {
                          timer = setTimeout(() => reject(new Error(message)), normalizeDelay(timeoutMs));
                      })
                  ]);
              } finally {
                  if (timer) clearTimeout(timer);
              }
          }

          module.exports = { delay, withTimeoutValue, withTimeoutReject };
          '''.replace("          ", ""))

          replace(
              "discord/index/server.js",
              'const { resolveActivityType } = require("../core/discordCompat");\n',
              'const { resolveActivityType } = require("../core/discordCompat");\nconst { delay: awaitedDelay } = require("../core/timers");\n'
          )
          replace(
              "discord/index/server.js",
              '''function wait(ms) {\n    return new Promise(resolve => {\n        const timer = setTimeout(resolve, ms);\n        timer.unref?.();\n    });\n}\n''',
              '''function wait(ms) {\n    return awaitedDelay(ms);\n}\n'''
          )

          replace(
              "discord/features/joinCampaign.js",
              'const { safeError } = require("../core/safeLogger");\n',
              'const { safeError } = require("../core/safeLogger");\nconst { delay: awaitedDelay } = require("../core/timers");\n'
          )
          replace(
              "discord/features/joinCampaign.js",
              '''function sleep(ms) {\n    return new Promise(resolve => {\n        const timer = setTimeout(resolve, ms);\n        timer.unref?.();\n    });\n}\n''',
              '''function sleep(ms) {\n    return awaitedDelay(ms);\n}\n'''
          )

          replace(
              "discord/voiceWorker/config.js",
              'const crypto = require("node:crypto");\n',
              'const crypto = require("node:crypto");\nconst { delay, withTimeoutValue, withTimeoutReject } = require("../core/timers");\n'
          )
          voice = read("discord/voiceWorker/config.js")
          start = voice.index('function delay(ms, value = undefined) {')
          end = voice.index('module.exports = {', start)
          write("discord/voiceWorker/config.js", voice[:start] + voice[end:])

          replace(
              "discord/dm/service.js",
              'const { profileFromUser, safeText } = require("./design");\n',
              'const { profileFromUser, safeText } = require("./design");\nconst { withTimeoutValue } = require("../core/timers");\n'
          )
          replace(
              "discord/dm/service.js",
              '''function withTimeout(promise, timeoutMs = PROFILE_FETCH_TIMEOUT_MS) {\n    let timer = null;\n    const raced = Promise.race([\n        Promise.resolve(promise).catch(() => null),\n        new Promise(resolve => {\n            timer = setTimeout(() => resolve(null), timeoutMs);\n            timer.unref?.();\n        })\n    ]);\n    return raced.finally(() => {\n        if (timer) clearTimeout(timer);\n    });\n}\n''',
              '''function withTimeout(promise, timeoutMs = PROFILE_FETCH_TIMEOUT_MS) {\n    return withTimeoutValue(Promise.resolve(promise).catch(() => null), timeoutMs, null);\n}\n'''
          )

          replace(
              "discord/index.js",
              '            }, 30000);\n            timer.unref?.();\n            function onReady() {\n',
              '            }, 30000);\n            function onReady() {\n'
          )

          write("discord/tests/timerLifecycle.test.js", '''"use strict";

          const assert = require("node:assert/strict");
          const { execFileSync } = require("node:child_process");
          const test = require("node:test");

          function runIsolated(script) {
              return execFileSync(process.execPath, ["-e", script], {
                  cwd: process.cwd(), encoding: "utf8", timeout: 5000
              }).trim();
          }

          test("awaited delay keeps an otherwise idle process alive", () => {
              const output = runIsolated(`
                  const { delay } = require("./discord/core/timers");
                  delay(25).then(() => process.stdout.write("resolved"));
              `);
              assert.equal(output, "resolved");
          });

          test("timeout value remains referenced until fallback resolution", () => {
              const output = runIsolated(`
                  const { withTimeoutValue } = require("./discord/core/timers");
                  withTimeoutValue(new Promise(() => {}), 25, "fallback")
                      .then(value => process.stdout.write(value));
              `);
              assert.equal(output, "fallback");
          });

          test("timeout rejection remains referenced until rejection", () => {
              const output = runIsolated(`
                  const { withTimeoutReject } = require("./discord/core/timers");
                  withTimeoutReject(new Promise(() => {}), 25, "expired")
                      .catch(error => process.stdout.write(error.message));
              `);
              assert.equal(output, "expired");
          });
          '''.replace("          ", ""))

          Path(".github/workflows/ttt-timer-hardening.yml").unlink()
          PY
      - name: Install dependencies
        run: |
          npm install --global --ignore-scripts npm@12.0.1
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate timer patch
        run: |
          npm run check:all
          npm run check:scripts
          node --test discord/tests/timerLifecycle.test.js
          npm run test:voice
      - name: Commit timer hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix awaited timer lifecycle across runtime services"
          git push origin HEAD:ttt
