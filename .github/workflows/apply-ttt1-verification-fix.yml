name: Apply TTT1 Verification Remediation

on:
  pull_request:
    branches:
      - ttt

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'ttt.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ttt.1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ttt.1
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct and apply remediation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ttt1-verification-fix/part-* > /tmp/verification-fix.patch.xz.b64
          echo "e3f87544a4c430c150d2b85139991fa655747eaa138356bb362702ff925b53f1  /tmp/verification-fix.patch.xz.b64" | sha256sum -c -
          base64 --decode /tmp/verification-fix.patch.xz.b64 > /tmp/verification-fix.patch.xz
          echo "cf6cb63aa1c13d25051db6ac921101f7c4b140e619aae75feac41c3ee5444101  /tmp/verification-fix.patch.xz" | sha256sum -c -
          xz --decompress --stdout /tmp/verification-fix.patch.xz > /tmp/verification-fix.patch
          echo "4fe8d085746d0312d96ae35d5fa6ecbc8111de32bf7f7193a3f07dbe95c75eff  /tmp/verification-fix.patch" | sha256sum -c -
          git apply --check --index /tmp/verification-fix.patch
          git apply --index /tmp/verification-fix.patch
          git rm -r .github/ttt1-verification-fix
      - name: Commit and push remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Coding Agent"
          git config user.email "noreply@openai.com"
          git commit -m "fix: align Verification integrity, refresh, and deployment contracts"
          git push origin HEAD:ttt.1
