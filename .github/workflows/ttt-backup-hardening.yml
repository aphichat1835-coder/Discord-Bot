name: ttt-backup-hardening

on:
  push:
    branches: [ttt]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ttt
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.18.0
          cache: npm
      - name: Apply backup hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(name): return Path(name).read_text(encoding="utf-8")
          def write(name, content): Path(name).write_text(content, encoding="utf-8")
          def replace(name, old, new):
              text = read(name)
              if old not in text: raise SystemExit(f"expected backup pattern not found: {name}")
              write(name, text.replace(old, new, 1))

          replace("discord/commands/utility.js",
              'const dmService = require("../dm");\n',
              'const dmService = require("../dm");\nconst { safeError } = require("../core/safeLogger");\n')
          replace("discord/commands/utility.js", 'function serializeRoleForBackup(role) {\n',
              '''function sortedCollectionValues(collection, compareFn) {\n    return Array.from(collection?.values?.() || []).sort(compareFn);\n}\n\nfunction serializeRoleForBackup(role) {\n''')
          replace("discord/commands/utility.js",
              '''            roles: interaction.guild.roles.cache\n                .sort((a, b) => a.position - b.position)\n                .map(serializeRoleForBackup),\n            channels: interaction.guild.channels.cache\n                .sort((a, b) => (a.rawPosition || 0) - (b.rawPosition || 0))\n                .map(serializeChannelForBackup)\n''',
              '''            roles: sortedCollectionValues(\n                interaction.guild.roles.cache,\n                (a, b) => a.position - b.position\n            ).map(serializeRoleForBackup),\n            channels: sortedCollectionValues(\n                interaction.guild.channels.cache,\n                (a, b) => (a.rawPosition || 0) - (b.rawPosition || 0)\n            ).map(serializeChannelForBackup)\n''')

          helpers = '''function buildBackupCreatedEvent(interaction, snapshotId, data, durationMs) {
              return {
                  target: "LOG", severity: "SUCCESS", category: "BACKUP", code: "backup.created",
                  title: "สร้างข้อมูลสำรองเซิร์ฟเวอร์สำเร็จ",
                  context: {
                      "Guild ID": String(interaction.guild?.id || "unknown"),
                      "User ID": String(interaction.user?.id || "unknown"),
                      "Snapshot ID": String(snapshotId || "unknown"),
                      "Schema": `v${data?.schemaVersion || 1}`,
                      "Roles": Number(data?.roles?.length || 0),
                      "Channels": Number(data?.channels?.length || 0),
                      "ระยะเวลา": `${Math.max(0, Number(durationMs || 0))} ms`
                  },
                  sourceIconUrl: getDiscordGuildIconUrl(interaction.guild),
                  thumbnailUrl: getDiscordAvatarUrl(interaction.user)
              };
          }

          function buildBackupFailedEvent(interaction, error, durationMs) {
              const guildId = String(interaction.guild?.id || "unknown");
              return {
                  target: "ALERT", severity: "ERROR", category: "BACKUP", code: "backup.failed", state: "OPEN",
                  title: "สร้างข้อมูลสำรองเซิร์ฟเวอร์ไม่สำเร็จ", description: safeError(error),
                  impact: "ไม่มีการสลับไปใช้ snapshot ที่บันทึกไม่ครบ",
                  action: "ตรวจ Runtime Log, MongoDB และสิทธิ์อ่านโครงสร้างเซิร์ฟเวอร์ก่อนลองใหม่",
                  context: {
                      "Guild ID": guildId,
                      "User ID": String(interaction.user?.id || "unknown"),
                      "ระยะเวลา": `${Math.max(0, Number(durationMs || 0))} ms`
                  },
                  sourceIconUrl: getDiscordGuildIconUrl(interaction.guild),
                  thumbnailUrl: getDiscordAvatarUrl(interaction.user),
                  dedupeKey: `backup-failed:${guildId}`, dedupeMs: 5 * 60 * 1000
              };
          }

          '''.replace("          ", "")
          replace("discord/commands/utility.js", "async function handleBackup(interaction) {\n", helpers + "async function handleBackup(interaction) {\n")
          replace("discord/commands/utility.js", '    activeBackups.add(interaction.guild.id);\n\n    try {\n',
              '    activeBackups.add(interaction.guild.id);\n    const backupStartedAt = Date.now();\n\n    try {\n')
          replace("discord/commands/utility.js", '        if (!stored) throw new Error("SNAPSHOT_SAVE_FAILED");\n\n        const embed = new MessageEmbed()\n',
              '''        if (!stored) throw new Error("SNAPSHOT_SAVE_FAILED");\n\n        sendWebhookEvent(buildBackupCreatedEvent(\n            interaction, snapshotId, data, Date.now() - backupStartedAt\n        )).catch(() => {});\n\n        const embed = new MessageEmbed()\n''')
          replace("discord/commands/utility.js",
              '    } catch (err) {\n        console.error("[BACKUP] Failed:", err.message);\n        return interaction.editReply({ content: `> ${config.emojis.error} สำรองข้อมูลไม่สำเร็จ และไม่ได้สลับไปใช้ snapshot ที่บันทึกไม่ครบ` });\n',
              '''    } catch (err) {\n        console.error("[BACKUP] Failed:", err.message);\n        sendWebhookEvent(buildBackupFailedEvent(\n            interaction, err, Date.now() - backupStartedAt\n        )).catch(() => {});\n        return interaction.editReply({ content: `> ${config.emojis.error} สำรองข้อมูลไม่สำเร็จ และไม่ได้สลับไปใช้ snapshot ที่บันทึกไม่ครบ` });\n''')
          replace("discord/commands/utility.js", '        buildRestoreDeliveryFailureEvent,\n',
              '        buildRestoreDeliveryFailureEvent,\n        buildBackupCreatedEvent,\n        buildBackupFailedEvent,\n        sortedCollectionValues,\n')

          test_file = "discord/tests/backupRestore.test.js"
          tests = read(test_file)
          marker = 'test("backup sorting does not mutate live Discord manager cache order"'
          if marker not in tests:
              tests += '''\n\ntest("backup sorting does not mutate live Discord manager cache order", () => { // NOSONAR -- node:test assertions are not recognized by Sonar S2699.\n    const cache = new Collection([\n        ["role-high", { id: "role-high", position: 10 }],\n        ["role-low", { id: "role-low", position: 1 }]\n    ]);\n    const before = Array.from(cache.keys());\n    const sorted = utility._test.sortedCollectionValues(cache, (a, b) => a.position - b.position);\n    assert.deepEqual(sorted.map(item => item.id), ["role-low", "role-high"]);\n    assert.deepEqual(Array.from(cache.keys()), before);\n});\n\ntest("backup webhook events contain bounded operational metadata", () => { // NOSONAR -- node:test assertions are not recognized by Sonar S2699.\n    const interaction = {\n        guild: { id: "111111111111111111", iconURL: () => null },\n        user: { id: "222222222222222222", displayAvatarURL: () => null }\n    };\n    const success = utility._test.buildBackupCreatedEvent(interaction, "snapshot-1", {\n        schemaVersion: 2, roles: [{}, {}], channels: [{}]\n    }, 15);\n    const failure = utility._test.buildBackupFailedEvent(interaction, new Error("database unavailable"), 20);\n    assert.equal(success.code, "backup.created");\n    assert.equal(success.context.Roles, 2);\n    assert.equal(success.context.Channels, 1);\n    assert.equal(failure.code, "backup.failed");\n    assert.equal(failure.target, "ALERT");\n    assert.match(failure.description, /database unavailable/);\n});\n'''
              write(test_file, tests)

          Path(".github/workflows/ttt-backup-hardening.yml").unlink()
          PY
      - name: Install dependencies
        run: |
          npm install --global --ignore-scripts npm@12.0.1
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate backup patch
        run: |
          npm run check:all
          node --test discord/tests/backupRestore.test.js discord/tests/dmSystem.test.js discord/tests/webhooks.test.js
      - name: Commit backup hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "protect backup cache order and add structured audit events"
          git push origin HEAD:ttt
