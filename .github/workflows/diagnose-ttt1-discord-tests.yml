name: Diagnose TTT1 Verification Tests

on:
  pull_request:
    branches:
      - ttt

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.head_ref == 'ttt.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ttt.1
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.18.0
      - name: Bootstrap pinned npm
        run: |
          npm install --global --ignore-scripts npm@12.0.1
          test "$(npm --version)" = "12.0.1"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Verification tests and capture full log
        id: tests
        shell: bash
        run: |
          set +e
          npm run test:coverage:verification > verification-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat verification-test.log
          exit 0
      - name: Upload Verification test diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ttt1-verification-test-diagnostics-${{ github.sha }}
          path: |
            verification-test.log
            coverage/verification.lcov
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve failure status
        if: ${{ steps.tests.outputs.status != '0' }}
        run: exit 1
