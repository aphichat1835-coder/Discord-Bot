name: Diagnose TTT1 Voice Coverage

on:
  pull_request:
    branches:
      - ttt

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.head_ref == 'ttt.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ttt.1
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.18.0
      - name: Bootstrap pinned npm
        run: |
          npm install --global --ignore-scripts npm@12.0.1
          test "$(npm --version)" = "12.0.1"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Voice tests and capture coverage
        id: tests
        shell: bash
        run: |
          set +e
          npm run test:coverage:voice > voice-test.log 2>&1
          test_status=$?
          node scripts/checkCoverageThresholds.js coverage/voice.lcov > voice-coverage.log 2>&1
          coverage_status=$?
          echo "status=$(( test_status || coverage_status ))" >> "$GITHUB_OUTPUT"
          cat voice-test.log
          cat voice-coverage.log
          exit 0
      - name: Upload Voice coverage diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ttt1-voice-coverage-diagnostics-${{ github.sha }}
          path: |
            voice-test.log
            voice-coverage.log
            coverage/voice.lcov
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failure status
        if: ${{ steps.tests.outputs.status != '0' }}
        run: exit 1
