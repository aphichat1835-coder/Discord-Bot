name: TEMP list all repository branches

on:
  pull_request:
    branches:
      - ttt.1

permissions:
  contents: write

jobs:
  list-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List every branch and remove audit branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          : > /tmp/branches.txt
          page=1
          while true; do
            response=$(curl --silent --show-error --fail \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches?per_page=100&page=${page}")
            count=$(jq 'length' <<<"${response}")
            if [ "${count}" -eq 0 ]; then
              break
            fi
            jq -r '.[].name' <<<"${response}" >> /tmp/branches.txt
            page=$((page + 1))
          done

          sort -u /tmp/branches.txt -o /tmp/branches.txt
          echo "BRANCH_LIST_BEGIN"
          cat /tmp/branches.txt
          echo "BRANCH_LIST_END"
          echo "BRANCH_COUNT=$(wc -l < /tmp/branches.txt | tr -d ' ')"

          status=$(curl --silent --show-error \
            --output /tmp/delete-response.json \
            --write-out "%{http_code}" \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_BRANCH}")
          if [ "${status}" != "204" ]; then
            echo "Could not remove audit branch; HTTP ${status}"
            cat /tmp/delete-response.json
            exit 1
          fi
          echo "Deleted audit branch ${HEAD_BRANCH}"
