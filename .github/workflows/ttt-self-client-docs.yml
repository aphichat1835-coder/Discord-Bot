name: ttt-self-client-docs

on:
  push:
    branches: [ttt]

permissions:
  contents: write

jobs:
  document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ttt
          fetch-depth: 0
      - name: Add owner-approved dependency references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          heading = "## Owner-approved self-client dependency"
          block = """## Owner-approved self-client dependency

          `discord.js-selfbot-v13` is an intentional and necessary dependency of the isolated Voice account/session subsystem. The repository owner has explicitly approved its continued use because the current architecture has no compatible replacement that preserves the required behavior.

          Do not remove, replace, migrate, rename, independently upgrade/downgrade, or convert its library-specific APIs unless the repository owner gives a new explicit instruction for that exact change. Main-bot Discord.js v14 work must remain isolated from the self-client package. See [`docs/SELF_CLIENT_POLICY.md`](docs/SELF_CLIENT_POLICY.md) for the binding maintenance policy.
          """.replace("          ", "").strip()

          files = [
              "README.md", "ARCHITECTURE.md", "CONTEXT.md", "SECURITY.md",
              "ROADMAP.md", "CHANGELOG.md", "AGENTS.md",
              ".github/copilot-instructions.md", "docs/RUNBOOK.md"
          ]
          for name in files:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if heading in text:
                  continue
              relative_block = block
              if name.startswith("docs/"):
                  relative_block = relative_block.replace("(docs/SELF_CLIENT_POLICY.md)", "(SELF_CLIENT_POLICY.md)")
              path.write_text(text.rstrip() + "\n\n" + relative_block + "\n", encoding="utf-8")

          Path(".github/workflows/ttt-self-client-docs.yml").unlink()
          PY
      - name: Verify policy references
        run: |
          test ! -e .github/workflows/ttt-self-client-docs.yml
          for file in README.md ARCHITECTURE.md CONTEXT.md SECURITY.md ROADMAP.md CHANGELOG.md AGENTS.md .github/copilot-instructions.md docs/RUNBOOK.md; do
            grep -q "Owner-approved self-client dependency" "$file"
            grep -q "SELF_CLIENT_POLICY.md" "$file"
          done
      - name: Commit policy references
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: preserve owner-approved self-client architecture invariant"
          git push origin HEAD:ttt
