name: Apply TTT1 Final Verification Fixes

on:
  pull_request:
    branches:
      - ttt

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'ttt.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ttt.1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ttt.1
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/ttt1-verification-final4/payload.b64 /tmp/fix.patch.xz.b64
          echo "82194f634737b3e939b6a3525cfdd3f886df30d0d7d2c72860e5791bca93db65  /tmp/fix.patch.xz.b64" | sha256sum -c -
          base64 --decode /tmp/fix.patch.xz.b64 > /tmp/fix.patch.xz
          echo "d251f12294e34e9fb786b2c1d455ad87aa078590e84dfc75cf662eede64fa2a7  /tmp/fix.patch.xz" | sha256sum -c -
          xz --decompress --stdout /tmp/fix.patch.xz > /tmp/fix.patch
          echo "55cb86f75b6d35f9fffb4746aab57fa941643b3db1b4e02d0998ceeb444839f0  /tmp/fix.patch" | sha256sum -c -
          git apply --check --index /tmp/fix.patch
          git apply --index /tmp/fix.patch
          git rm -r .github/ttt1-verification-final4
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Coding Agent"
          git config user.email "noreply@openai.com"
          git commit -m "test: complete Verification reconstruction and CAS fixtures"
          git push origin HEAD:ttt.1
