name: Apply Environment Smoke Binding

on:
  pull_request:
    branches:
      - ttt

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'ttt.1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ttt.1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ttt.1
          fetch-depth: 0
          persist-credentials: true

      - name: Bind smoke to exact preview SHA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          target = Path("scripts/runIsolatedEnvironmentGate.js")
          text = target.read_text()
          old = '''            env: {
                ...process.env,
                SMOKE_ALLOWED_HOSTS: config.allowedHosts.join(",")
            },'''
          new = '''            env: {
                ...process.env,
                SMOKE_ALLOWED_HOSTS: config.allowedHosts.join(","),
                SMOKE_EXPECTED_COMMIT_SHA: config.commitSha,
                SMOKE_REQUIRE_PREVIEW: "true"
            },'''
          if text.count(old) != 1:
              raise SystemExit("deployment smoke environment anchor mismatch")
          target.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/runIsolatedEnvironmentGate.js
          git diff --check
          git rm .github/workflows/apply-environment-smoke-binding.yml

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Coding Agent"
          git config user.email "noreply@openai.com"
          git add scripts/runIsolatedEnvironmentGate.js
          git commit -m "test: bind deployed smoke to exact preview SHA"
          git push origin HEAD:ttt.1
