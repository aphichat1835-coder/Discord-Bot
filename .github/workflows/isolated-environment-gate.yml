name: Isolated Environment Gate

on:
  pull_request:
    branches:
      - ttt
      - ttt.1
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA being verified
        required: true
        type: string
      confirmation:
        description: Type ISOLATED_TEST_ONLY to confirm this is not production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: isolated-environment-${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
  cancel-in-progress: false

env:
  TEST_ENVIRONMENT_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'ISOLATED_TEST_ONLY' }}
  TEST_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.event.pull_request.head.sha }}
  TEST_MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
  TEST_DISCORD_TOKEN: ${{ secrets.TEST_DISCORD_TOKEN }}
  TEST_GUILD_ID: ${{ secrets.TEST_GUILD_ID }}
  TEST_TEXT_CHANNEL_ID: ${{ secrets.TEST_TEXT_CHANNEL_ID }}
  TEST_VOICE_CHANNEL_ID: ${{ secrets.TEST_VOICE_CHANNEL_ID }}
  TEST_DISCORD_CLIENT_ID: ${{ secrets.TEST_DISCORD_CLIENT_ID }}
  TEST_DISCORD_CLIENT_SECRET: ${{ secrets.TEST_DISCORD_CLIENT_SECRET }}
  TEST_PUBLIC_BASE_URL: ${{ secrets.TEST_PUBLIC_BASE_URL }}
  TEST_ALLOWED_HOSTS: ${{ vars.TEST_ALLOWED_HOSTS }}
  PRODUCTION_PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_BASE_URL }}
  PRODUCTION_DISCORD_CLIENT_IDS: ${{ vars.PRODUCTION_DISCORD_CLIENT_IDS }}
  PRODUCTION_GUILD_IDS: ${{ vars.PRODUCTION_GUILD_IDS }}
  PRODUCTION_CHANNEL_IDS: ${{ vars.PRODUCTION_CHANNEL_IDS }}
  GATE_RECORD_DIR: artifacts

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.head_ref == 'ttt.1' || github.base_ref == 'ttt.1')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: isolated-integration
    steps:
      - name: Initialize redacted environment record
        shell: bash
        env:
          FALLBACK_GATE_RECORD_DIR: ${{ runner.temp }}/environment-gate-fallback
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const rawSha = String(process.env.TEST_COMMIT_SHA || process.env.GITHUB_SHA || "").trim().toLowerCase();
          const safeSha = /^[a-f0-9]{40}$/.test(rawSha) ? rawSha : "local";
          const directory = path.resolve(process.env.FALLBACK_GATE_RECORD_DIR);
          fs.mkdirSync(directory, { recursive: true });
          const record = {
            schemaVersion: 1,
            status: "failed",
            startedAt: new Date().toISOString(),
            finishedAt: null,
            commitSha: rawSha || "local",
            errorCode: "GATE_NOT_COMPLETED",
            evidence: {}
          };
          fs.writeFileSync(
            path.join(directory, `environment-gate-${safeSha}.json`),
            JSON.stringify(record, null, 2) + "\n",
            { mode: 0o600 }
          );
          NODE

      - name: Checkout exact ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TEST_COMMIT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.18.0

      - name: Bootstrap pinned npm
        run: |
          npm install --global --ignore-scripts npm@12.0.1
          test "$(npm --version)" = "12.0.1"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repository checks excluding approval-bound diff guard
        run: |
          npm run check:protected-syntax
          npm run check:discord14
          npm run check:secrets
          npm run check:all
          npm run check:scripts
          npm run check:memory-guards
          npm run check:mongoose9

      - name: Full automated suites and coverage
        run: |
          npm run test:coverage:discord
          npm run test:coverage:voice
          npm run test:coverage:verification
          npm run check:coverage
          npm audit --audit-level=high

      - name: Run isolated external environment gate
        run: npm run gate:environment

      - name: Prefer final environment record
        if: ${{ always() }}
        shell: bash
        env:
          FALLBACK_GATE_RECORD_DIR: ${{ runner.temp }}/environment-gate-fallback
        run: |
          set -euo pipefail
          if compgen -G "artifacts/environment-gate-*.json" > /dev/null; then
            rm -rf "$FALLBACK_GATE_RECORD_DIR"
          fi

      - name: Upload redacted environment record
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-environment-gate-${{ env.TEST_COMMIT_SHA }}
          path: |
            artifacts/environment-gate-*.json
            ${{ runner.temp }}/environment-gate-fallback/environment-gate-*.json
          if-no-files-found: error
          retention-days: 30
